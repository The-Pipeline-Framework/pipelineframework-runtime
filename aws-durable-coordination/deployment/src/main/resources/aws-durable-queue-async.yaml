AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Supported TPF QUEUE_ASYNC coordination host using AWS Lambda Durable Functions

Parameters:
  DeploymentProfile:
    Type: String
    Default: HARDENED
    AllowedValues: [HARDENED, RESTRICTED_PILOT]
    Description: Restricted pilot is a fresh isolated supervised deployment; it preserves every native recovery mechanism
  RestrictedPilotValidation:
    Type: String
    Default: not-applicable
    AllowedValues: [not-applicable, validated]
    Description: Attest supervised admissions, operator failure checks, service-owned encryption and exact external resource metadata; no unattended operations acceptance
  SigningSource:
    Type: String
    Default: SECRETS_MANAGER
    AllowedValues: [SECRETS_MANAGER, SSM_STANDARD]
  SigningParameterLifecycleValidation:
    Type: String
    Default: not-applicable
    AllowedValues: [not-applicable, validated]
    Description: Owner verified Standard SecureString aws/ssm parameters, unique immutable purpose/generation names, version 1, no overwrite/deletion while any retained release needs them; IAM-only account authority accepted
  ResumeTokenParameterArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|arn:[a-z-]+:ssm:[a-z0-9-]+:[0-9]{12}:parameter/tpf/durable/[A-Za-z0-9._-]+/resume-token/g-[a-f0-9]{32,64}'
  ResumeTokenParameterVersion: {Type: String, Default: '', AllowedValues: ['', '1']}
  WorkerSharedParameterArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|arn:[a-z-]+:ssm:[a-z0-9-]+:[0-9]{12}:parameter/tpf/durable/[A-Za-z0-9._-]+/worker/g-[a-f0-9]{32,64}'
  WorkerSharedParameterVersion: {Type: String, Default: '', AllowedValues: ['', '1']}
  SigningParameterAccessArns:
    Type: CommaDelimitedList
    Default: ''
    AllowedPattern: '^$|arn:[a-z-]+:ssm:[a-z0-9-]+:[0-9]{12}:parameter/tpf/durable/[A-Za-z0-9._-]+/(resume-token|worker)/g-[a-f0-9]{32,64}'
    Description: Exact current and retained immutable signing parameter ARNs; never remove while retained versions/executions require them
  AlarmTopicArn:
    Type: String
    AllowedPattern: '^$|arn:[a-z-]+:sns:[a-z0-9-]+:[0-9]{12}:.+'
    Description: HARDENED requires owned SNS notification delivery; RESTRICTED_PILOT requires explicit empty input and supervised failure checks
  DeploymentPreflightValidation:
    Type: String
    AllowedValues: [validated]
    Description: >-
      Set only after validating region, Java21 Durable SDK/runtime capability, account
      start/checkpoint/history quotas, reserved concurrency, operation/state/payload budgets,
      semantic table/index readiness, encryption key policies, retained release compatibility
      and profile-specific observation (HARDENED notification delivery or RESTRICTED_PILOT supervised failure checks). This attestation performs no AWS probes or provisioning.
  ReleaseIsolationMode:
    Type: String
    AllowedValues: [FRESH_RELEASE_ISOLATED_STACK, DRAINED_RELEASE_MIGRATION]
    Description: Fresh release uses isolated stack queues, callback table and semantic state namespace; migration requires every old execution and queue/stream/DLQ obligation drained with producers quiesced
  ReleaseIsolationValidation:
    Type: String
    AllowedValues: [validated]
    Description: Explicitly attest the selected isolation mode; moving shared consumers or coordinator aliases while retained executions need the previous release is forbidden
  TransitionWorkerPlacement:
    Type: String
    AllowedValues: [FUNCTION, COMPUTE]
    Description: COMPUTE disables only transition Lambda consumption; one external consumer must own the signed request queue
  ComputeTransitionConsumerValidation:
    Type: String
    AllowedValues: [not-applicable, validated]
    Description: For COMPUTE validate exclusive queue ownership, pinned release/digest, signing keys and retry/DLQ protocol
  LogRetentionDays: {Type: Number, Default: 30, AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]}
  HostKmsKeyArn:
    Type: String
    AllowedPattern: 'arn:[a-z-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+'
    Description: Retained CMK with validated Lambda Durable, DynamoDB, SQS, EventBridge and scoped Logs service/key policies
  SemanticKmsKeyArns:
    Default: ''
    Type: CommaDelimitedList
    AllowedPattern: '^$|arn:[a-z-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+'
    Description: Exact externally owned semantic table and release artifact CMKs; validate scoped key policies and retention in preflight
  DurableEstimatedOperations: {Type: Number, MinValue: 1, MaxValue: 3000}
  DurableEstimatedWrittenStateBytes: {Type: Number, MinValue: 1, MaxValue: 104857600}
  DurableActionTimeoutSeconds: {Type: Number, Default: 120, MinValue: 1, MaxValue: 900}
  CallbackRetentionSeconds: {Type: Number, MinValue: 1}
  OutstandingCompletionObservationAlarmCount:
    Type: Number
    Default: 100
    MinValue: 0
    Description: Maximum scoped OUTSTANDING observations in five minutes; repeated reads count separately and are not a population inventory
  CompletionReleaseLatencyAlarmMilliseconds:
    Type: Number
    MinValue: 1
    Description: Operator-owned threshold for sampled native admission-to-release latency; this does not measure provider callback-to-resume latency
  CallbackResumeLatencyAlarmMilliseconds:
    Type: Number
    MinValue: 1
    Description: Operator-owned threshold for host API-success observation to first resumed action samples; missing acknowledgements and history-only success are unmeasured
  RepairAgeAlarmMilliseconds:
    Type: Number
    MinValue: 1
    Description: Operator-owned threshold for age sampled on targeted repair attempts; not a complete open-repair inventory and samples may stop after retry exhaustion
  PipelineId: {Type: String, AllowedPattern: '[A-Za-z0-9._:/-]{1,128}'}
  ContractVersion: {Type: String, AllowedPattern: '[A-Za-z0-9._:/-]{1,128}', Description: Exact compiler-generated semantic contract version of the pinned release}
  ReleaseArtifactId: {Type: String, AllowedPattern: '[A-Za-z0-9._:/-]{1,128}', Description: Exact primary deployable artifact identifier in the pinned release descriptor}
  ReleaseVersion: {Type: String, AllowedPattern: '[A-Za-z0-9._:/-]{1,128}'}
  ReleaseArtifactDigest: {Type: String, AllowedPattern: '[a-f0-9]{64}'}
  ReleaseArtifactBucket: {Type: String, AllowedPattern: '[a-z0-9.-]{3,63}'}
  ExecutionTable: {Type: String, AllowedPattern: '[A-Za-z0-9_.-]{3,255}'}
  ExecutionKeyTable: {Type: String, AllowedPattern: '[A-Za-z0-9_.-]{3,255}'}
  ExecutionPayloadTable: {Type: String, AllowedPattern: '[A-Za-z0-9_.-]{3,255}'}
  AwaitInteractionTable: {Type: String, AllowedPattern: '[A-Za-z0-9_.-]{3,255}'}
  AwaitInteractionKeyTable: {Type: String, AllowedPattern: '[A-Za-z0-9_.-]{3,255}'}
  AwaitCompletionLifecycleTable: {Type: String, AllowedPattern: '[A-Za-z0-9_.-]{3,255}', Description: 'Externally owned pk/sk table for immutable native admission and release facts; TTL ttl_epoch_s, PITR and deletion protection; fresh/drained protocol namespace required'}
  AwaitUnitTable: {Type: String, AllowedPattern: '[A-Za-z0-9_.-]{3,255}'}
  AwaitAdmissionTable: {Type: String, AllowedPattern: '[A-Za-z0-9_.-]{3,255}'}
  ReleaseTable: {Type: String, AllowedPattern: '[A-Za-z0-9_.-]{3,255}'}
  WorkerTable: {Type: String, AllowedPattern: '[A-Za-z0-9_.-]{3,255}'}
  DurableArtifactBucket: {Type: String}
  DurableArtifactKey: {Type: String}
  DurableCodeSha256: {Type: String, AllowedPattern: '[A-Za-z0-9+/]{43}='}
  ActionCodeSha256: {Type: String, AllowedPattern: '[A-Za-z0-9+/]{43}='}
  VersionPublicationId:
    Type: String
    AllowedPattern: '[A-Za-z0-9._-]{1,64}'
    Description: Unique release/configuration revision; change whenever either package or its configuration changes
  ActionArtifactUri:
    Type: String
    Description: S3 URI for the generated Quarkus action and worker Lambda package
  CallbackGenerationMigrationValidation:
    Type: String
    AllowedValues: [validated]
    ConstraintDescription: Must be validated before enabling callback writers
    Description: >-
      Set validated only after confirming a fresh table has no retained executions,
      or completing and validating the retained table's generation-claim migration
      with unfenced writers quiesced. This is an operator attestation, not an automatic data check.
  CallbackOccurrenceMigrationValidation:
    Type: String
    AllowedValues: [validated]
    ConstraintDescription: Must be validated before enabling occurrence-aware callback writers
    Description: >-
      Set validated only for a fresh table, or after legacy callback executions have
      drained and their writers are quiesced or isolated on their original table.
      Retained coordinator, action, wake-up and repair versions must remain protocol-compatible.
      This attestation does not migrate callback rows or inspect retained executions.
  ExecutionRecoveryMigrationValidation:
    Type: String
    AllowedValues: [validated]
    ConstraintDescription: Validate retained execution recovery locators and compatible pinned packages before deployment
    Description: >-
      Set validated only for a fresh host without retained executions, or after validating
      a retained locator and generation claim for every live execution. Drain or isolate
      legacy coordinators that lack locator registration or invoke unqualified action code.
      Retain the original numbered coordinator and action packages for recovery.
  AwaitInteractionStreamArn: {Type: String}
  ExecutionStateStreamArn:
    Type: String
    Description: Exact Stream ARN of the TPF execution state table for terminal callback settlement
  SemanticDynamoResourceArns:
    Type: CommaDelimitedList
    Description: Exact TPF semantic table and index ARNs required by the action host
  ResumeTokenSecretArn:
    Default: ''
    Type: String
    AllowedPattern: '^$|arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+-[A-Za-z0-9]{6}'
  ResumeTokenSecretVersion: {Type: String, Default: '', AllowedPattern: '^$|[A-Za-z0-9-]{32,64}'}
  WorkerSharedSecretArn:
    Default: ''
    Type: String
    AllowedPattern: '^$|arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+-[A-Za-z0-9]{6}'
  WorkerSharedSecretVersion: {Type: String, Default: '', AllowedPattern: '^$|[A-Za-z0-9-]{32,64}'}
  SigningKmsKeyArn:
    Default: ''
    Type: String
    AllowedPattern: '^$|arn:[a-z-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+'
    Description: Retained CMK of both signing secrets; reads are constrained to Secrets Manager and those exact secret ARNs
  SigningSecretAccessArns:
    Type: CommaDelimitedList
    AllowedPattern: '^$|arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+-[A-Za-z0-9]{6}'
    Description: Exact current and retained signing secret ARNs; retain access while numbered host versions or executions require them
  SigningKmsAccessArns:
    Type: CommaDelimitedList
    AllowedPattern: '^$|arn:[a-z-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+'
    Description: Exact current and retained signing CMKs; do not remove keys needed by retained signing secret versions
  DurableExecutionTimeoutSeconds: {Type: Number, Default: 2592000, MinValue: 1, MaxValue: 31622400}
  DurableRetentionDays: {Type: Number, Default: 30, MinValue: 1, MaxValue: 90}
  DurableAlias: {Type: String, Default: live, AllowedPattern: '[A-Za-z0-9-_]+'}
  ActionHandler: {Type: String, Default: aws-durable-action}
  WorkHandler: {Type: String, Default: aws-durable-work-item}
  AwaitCompletionHandler: {Type: String, Default: aws-durable-await-completion}
  TransitionWorkerHandler: {Type: String, Default: aws-durable-transition-worker}
  AwaitWakeupHandler: {Type: String, Default: aws-durable-await-wakeup}
  ExecutionWakeupHandler: {Type: String, Default: aws-durable-execution-wakeup}
  DueWorkHandler: {Type: String, Default: aws-durable-due-work}
  DueWorkSweepLimit: {Type: Number, Default: 100, MinValue: 1, MaxValue: 1000}
  ReconciliationHandler: {Type: String, Default: aws-durable-reconcile}

Conditions:
  HardenedProfile: !Equals [!Ref DeploymentProfile, HARDENED]
  RestrictedPilotProfile: !Equals [!Ref DeploymentProfile, RESTRICTED_PILOT]
  HardenedFunctionTransition: !And [!Condition HardenedProfile, !Condition FunctionTransitionConsumer]
  SecretsManagerSigning: !Equals [!Ref SigningSource, SECRETS_MANAGER]
  FunctionTransitionConsumer: !Equals [!Ref TransitionWorkerPlacement, FUNCTION]

Rules:
  ProfileSigningSelection:
    Assertions:
      - Assert: !Or
          - !And [!Equals [!Ref DeploymentProfile, HARDENED], !Equals [!Ref SigningSource, SECRETS_MANAGER]]
          - !And [!Equals [!Ref DeploymentProfile, RESTRICTED_PILOT], !Equals [!Ref SigningSource, SSM_STANDARD]]
        AssertDescription: Signing and encryption modes must match the selected profile; no mixed authority
  RestrictedPilotRequirements:
    RuleCondition: !Equals [!Ref DeploymentProfile, RESTRICTED_PILOT]
    Assertions:
      - Assert: !Equals [!Ref AlarmTopicArn, '']
        AssertDescription: Restricted pilot provisions no alarm and requires no SNS destination
      - Assert: !Equals [!Ref RestrictedPilotValidation, validated]
        AssertDescription: Restricted pilot requires supervised operational and security acceptance
      - Assert: !Equals [!Ref SigningParameterLifecycleValidation, validated]
        AssertDescription: Signing parameter metadata and immutable retention must be verified by its owner
      - Assert: !Equals [!Ref ReleaseIsolationMode, FRESH_RELEASE_ISOLATED_STACK]
        AssertDescription: Never retrofit service-owned encryption or SSM onto retained release resources
      - Assert: !Equals [!Ref TransitionWorkerPlacement, FUNCTION]
        AssertDescription: Restricted profile qualifies only the native FUNCTION consumer
      - Assert: !Equals [!Ref ResumeTokenParameterVersion, '1']
        AssertDescription: Immutable generation starts at version 1; rotation creates a new parameter
      - Assert: !Equals [!Ref WorkerSharedParameterVersion, '1']
        AssertDescription: Immutable generation starts at version 1; rotation creates a new parameter
      - Assert: !Not [!Equals [!Ref ResumeTokenParameterArn, '']]
        AssertDescription: Require the exact purpose and generation resume parameter ARN
      - Assert: !Not [!Equals [!Ref WorkerSharedParameterArn, '']]
        AssertDescription: Require the exact purpose and generation worker parameter ARN
      - Assert: !Contains [!Ref SigningParameterAccessArns, !Ref ResumeTokenParameterArn]
        AssertDescription: Current resume parameter must remain accessible
      - Assert: !Contains [!Ref SigningParameterAccessArns, !Ref WorkerSharedParameterArn]
        AssertDescription: Current worker parameter must remain accessible
      - Assert: !Equals [!Ref ResumeTokenSecretArn, '']
        AssertDescription: Mixed signing sources are forbidden
      - Assert: !Equals [!Ref WorkerSharedSecretArn, '']
        AssertDescription: Mixed signing sources are forbidden
      - Assert: !Equals [!Ref ResumeTokenSecretVersion, '']
        AssertDescription: Mixed signing sources are forbidden
      - Assert: !Equals [!Ref WorkerSharedSecretVersion, '']
        AssertDescription: Mixed signing sources are forbidden
      - Assert: !Equals [!Ref SigningKmsKeyArn, '']
        AssertDescription: SSM uses aws/ssm and cannot claim a signing CMK
      - Assert: !EachMemberEquals [!Ref SigningSecretAccessArns, '']
        AssertDescription: SSM signing must not retain a Secrets Manager grant
      - Assert: !EachMemberEquals [!Ref SigningKmsAccessArns, '']
        AssertDescription: SSM signing must not retain a signing CMK grant
      - Assert: !EachMemberEquals [!Ref SemanticKmsKeyArns, '']
        AssertDescription: Service-owned semantic encryption must not claim semantic CMKs
  HardenedRequirements:
    RuleCondition: !Equals [!Ref DeploymentProfile, HARDENED]
    Assertions:
      - Assert: !Not [!Equals [!Ref AlarmTopicArn, '']]
        AssertDescription: Hardened operations require an owned SNS destination
      - Assert: !Not [!Equals [!Ref ResumeTokenSecretArn, '']]
        AssertDescription: Hardened signing requires Secrets Manager
      - Assert: !Not [!Equals [!Ref WorkerSharedSecretArn, '']]
        AssertDescription: Hardened signing requires Secrets Manager
      - Assert: !Not [!Equals [!Ref ResumeTokenSecretVersion, '']]
        AssertDescription: Hardened signing requires exact retained version
      - Assert: !Not [!Equals [!Ref WorkerSharedSecretVersion, '']]
        AssertDescription: Hardened signing requires exact retained version
      - Assert: !Not [!Equals [!Ref SigningKmsKeyArn, '']]
        AssertDescription: Hardened signing requires a retained CMK
      - Assert: !Not [!Contains [!Ref SemanticKmsKeyArns, '']]
        AssertDescription: Hardened semantic encryption requires scoped CMKs
      - Assert: !Equals [!Ref ResumeTokenParameterArn, '']
        AssertDescription: Mixed signing sources are forbidden
      - Assert: !Equals [!Ref WorkerSharedParameterArn, '']
        AssertDescription: Mixed signing sources are forbidden
      - Assert: !Equals [!Ref ResumeTokenParameterVersion, '']
        AssertDescription: Mixed signing sources are forbidden
      - Assert: !Equals [!Ref WorkerSharedParameterVersion, '']
        AssertDescription: Mixed signing sources are forbidden
      - Assert: !EachMemberEquals [!Ref SigningParameterAccessArns, '']
        AssertDescription: Hardened signing cannot include SSM grants
  ReleaseIsolationValidated:
    Assertions:
      - Assert: !Equals [!Ref ReleaseIsolationValidation, validated]
        AssertDescription: Require a fresh release-isolated stack or fully drained migration; compatible in-place upgrades are not accepted
  CurrentSigningReferencesAccessible:
    RuleCondition: !Equals [!Ref SigningSource, SECRETS_MANAGER]
    Assertions:
      - Assert: !Contains [!Ref SigningSecretAccessArns, !Ref ResumeTokenSecretArn]
        AssertDescription: Resume signing reference must be included in the scoped secret access set
      - Assert: !Contains [!Ref SigningSecretAccessArns, !Ref WorkerSharedSecretArn]
        AssertDescription: Worker signing reference must be included in the scoped secret access set
      - Assert: !Contains [!Ref SigningKmsAccessArns, !Ref SigningKmsKeyArn]
        AssertDescription: Current signing CMK must be included in the retained CMK access set
  ExecutionRecoveryMigrationValidated:
    Assertions:
      - Assert: !Equals [!Ref ExecutionRecoveryMigrationValidation, validated]
        AssertDescription: Execution recovery requires validated locators and pinned package compatibility
  DeploymentPreflightValidated:
    Assertions:
      - Assert: !Equals [!Ref DeploymentPreflightValidation, validated]
        AssertDescription: Deployment requires explicit provider, quota, encryption and release preflight
  ExclusiveComputeTransitionConsumer:
    RuleCondition: !Equals [!Ref TransitionWorkerPlacement, COMPUTE]
    Assertions:
      - Assert: !Equals [!Ref ComputeTransitionConsumerValidation, validated]
        AssertDescription: COMPUTE requires one validated consumer and no Lambda competitor
  CallbackGenerationMigrationValidated:
    Assertions:
      - Assert: !Equals [!Ref CallbackGenerationMigrationValidation, validated]
        AssertDescription: Callback writers require a validated generation-claim migration or a fresh table

  CallbackOccurrenceMigrationValidated:
    Assertions:
      - Assert: !Equals [!Ref CallbackOccurrenceMigrationValidation, validated]
        AssertDescription: Callback writers require validated occurrence protocol isolation or a fresh table

Globals:
  Function:
    Runtime: java21
    Architectures: [arm64]
    Tracing: Active
    Tags: {tpf-coordination-host: aws-durable}

Resources:
  CallbackBindingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SSESpecification: !If [HardenedProfile, {SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref HostKmsKeyArn}, {SSEEnabled: false}]
      DeletionProtectionEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: provider_execution_arn, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      # For existing tables, add provider-registration-index and wait for ACTIVE
      # before upgrading the repair host. Existing records need no backfill.
      # Keep provider-execution-index while retained host versions still use it.
      GlobalSecondaryIndexes:
        - IndexName: provider-execution-index
          KeySchema: [{AttributeName: provider_execution_arn, KeyType: HASH}]
          Projection: {ProjectionType: ALL}
        - IndexName: provider-registration-index
          KeySchema:
            - {AttributeName: provider_execution_arn, KeyType: HASH}
            - {AttributeName: sk, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      StreamSpecification: {StreamViewType: NEW_AND_OLD_IMAGES}
      TimeToLiveSpecification: {AttributeName: expires_at_epoch_s, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  WorkDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600, KmsMasterKeyId: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue'], SqsManagedSseEnabled: !If [HardenedProfile, !Ref 'AWS::NoValue', true]}
  WorkQueue:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue']
      SqsManagedSseEnabled: !If [HardenedProfile, !Ref 'AWS::NoValue', true]
      VisibilityTimeout: 5400
      RedrivePolicy: {deadLetterTargetArn: !GetAtt WorkDlq.Arn, maxReceiveCount: 5}
  AwaitCompletionDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600, KmsMasterKeyId: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue'], SqsManagedSseEnabled: !If [HardenedProfile, !Ref 'AWS::NoValue', true]}
  AwaitCompletionQueue:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue']
      SqsManagedSseEnabled: !If [HardenedProfile, !Ref 'AWS::NoValue', true]
      VisibilityTimeout: 720
      RedrivePolicy: {deadLetterTargetArn: !GetAtt AwaitCompletionDlq.Arn, maxReceiveCount: 5}
  TransitionDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600, KmsMasterKeyId: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue'], SqsManagedSseEnabled: !If [HardenedProfile, !Ref 'AWS::NoValue', true]}
  TransitionRequestQueue:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue']
      SqsManagedSseEnabled: !If [HardenedProfile, !Ref 'AWS::NoValue', true]
      VisibilityTimeout: 5400
      RedrivePolicy: {deadLetterTargetArn: !GetAtt TransitionDlq.Arn, maxReceiveCount: 5}
  TransitionResponseQueue:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {VisibilityTimeout: 720, MessageRetentionPeriod: 1209600, KmsMasterKeyId: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue'], SqsManagedSseEnabled: !If [HardenedProfile, !Ref 'AWS::NoValue', true]}
  DurableDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600, KmsMasterKeyId: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue'], SqsManagedSseEnabled: !If [HardenedProfile, !Ref 'AWS::NoValue', true]}
  StreamFailureDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600, KmsMasterKeyId: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue'], SqsManagedSseEnabled: !If [HardenedProfile, !Ref 'AWS::NoValue', true]}

  DueWorkDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600, KmsMasterKeyId: !Ref HostKmsKeyArn}
  DueWorkQueue:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !Ref HostKmsKeyArn
      VisibilityTimeout: 720
      MessageRetentionPeriod: 86400
      RedrivePolicy: {deadLetterTargetArn: !GetAtt DueWorkDlq.Arn, maxReceiveCount: 5}

  DueWorkRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: bounded-semantic-due-work
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - !If
                - SecretsManagerSigning
                - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref SigningSecretAccessArns}
                - {Effect: Allow, Action: 'ssm:GetParameter', Resource: !Ref SigningParameterAccessArns}
              - !If
                - SecretsManagerSigning
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref SigningKmsAccessArns
                  Condition:
                    StringEquals: {kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'}
                    StringLike:
                      kms:EncryptionContext:SecretARN: !Ref SigningSecretAccessArns
                - !Ref 'AWS::NoValue'
              - !If
                - HardenedProfile
                - {Effect: Allow, Action: [kms:Decrypt, kms:GenerateDataKey], Resource: !Ref HostKmsKeyArn}
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref HostKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub 'sqs.${AWS::Region}.amazonaws.com'
                      kms:EncryptionContext:aws:sqs:arn: !GetAtt DueWorkQueue.Arn
              - !If
                - HardenedProfile
                - {Effect: Allow, Action: [kms:Decrypt, kms:GenerateDataKey], Resource: !Ref SemanticKmsKeyArns}
                - !Ref 'AWS::NoValue'
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: [!GetAtt DueWorkQueue.Arn, !GetAtt TransitionResponseQueue.Arn]
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ReleaseArtifactBucket}/tpf/releases/*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem,
                  dynamodb:BatchGetItem, dynamodb:ConditionCheckItem, dynamodb:TransactWriteItems,
                  dynamodb:Query, dynamodb:DescribeTable]
                Resource: !Ref SemanticDynamoResourceArns
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: [!GetAtt WorkQueue.Arn, !GetAtt TransitionRequestQueue.Arn, !GetAtt WorkDlq.Arn]

  DurableRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: durable-checkpoint-and-action
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - !If
                - HardenedProfile
                - {Effect: Allow, Action: [kms:Decrypt, kms:GenerateDataKey], Resource: !Ref HostKmsKeyArn}
                - !Ref 'AWS::NoValue'
              - Effect: Allow
                Action: ['lambda:CheckpointDurableExecution', 'lambda:GetDurableExecutionState']
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-durable:*'
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-action:*'
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DurableDlq.Arn

  IngressRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: start-durable
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - !If
                - HardenedProfile
                - {Effect: Allow, Action: [kms:Decrypt, kms:GenerateDataKey], Resource: !Ref HostKmsKeyArn}
                - !Ref 'AWS::NoValue'
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DurableDlq.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref DurableVersion

  ActionRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: bounded-tpf-actions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - !If
                - SecretsManagerSigning
                - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref SigningSecretAccessArns}
                - {Effect: Allow, Action: 'ssm:GetParameter', Resource: !Ref SigningParameterAccessArns}
              - !If
                - SecretsManagerSigning
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref SigningKmsAccessArns
                  Condition:
                    StringEquals: {kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'}
                    StringLike:
                      kms:EncryptionContext:SecretARN: !Ref SigningSecretAccessArns
                - !Ref 'AWS::NoValue'
              - !If
                - HardenedProfile
                - {Effect: Allow, Action: [kms:Decrypt, kms:GenerateDataKey], Resource: !Ref HostKmsKeyArn}
                - !Ref 'AWS::NoValue'
              - !If
                - HardenedProfile
                - {Effect: Allow, Action: [kms:Decrypt, kms:GenerateDataKey], Resource: !Ref SemanticKmsKeyArns}
                - !Ref 'AWS::NoValue'
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: !GetAtt TransitionResponseQueue.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ReleaseArtifactBucket}/tpf/releases/*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem,
                  dynamodb:BatchGetItem, dynamodb:ConditionCheckItem, dynamodb:TransactWriteItems,
                  dynamodb:Query, dynamodb:DescribeTable]
                Resource: !Ref SemanticDynamoResourceArns
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:ConditionCheckItem, dynamodb:Query]
                Resource: !GetAtt CallbackBindingTable.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: [!GetAtt WorkQueue.Arn, !GetAtt TransitionRequestQueue.Arn]

  WorkerRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: sqs-worker-boundary
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - !If
                - SecretsManagerSigning
                - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref SigningSecretAccessArns}
                - {Effect: Allow, Action: 'ssm:GetParameter', Resource: !Ref SigningParameterAccessArns}
              - !If
                - SecretsManagerSigning
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref SigningKmsAccessArns
                  Condition:
                    StringEquals: {kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'}
                    StringLike:
                      kms:EncryptionContext:SecretARN: !Ref SigningSecretAccessArns
                - !Ref 'AWS::NoValue'
              - !If
                - HardenedProfile
                - {Effect: Allow, Action: [kms:Decrypt, kms:GenerateDataKey], Resource: !Ref HostKmsKeyArn}
                - !Ref 'AWS::NoValue'
              - !If
                - HardenedProfile
                - {Effect: Allow, Action: [kms:Decrypt, kms:GenerateDataKey], Resource: !Ref SemanticKmsKeyArns}
                - !Ref 'AWS::NoValue'
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: [!GetAtt WorkQueue.Arn, !GetAtt AwaitCompletionQueue.Arn, !GetAtt TransitionRequestQueue.Arn]
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: [!GetAtt TransitionResponseQueue.Arn, !GetAtt WorkDlq.Arn,
                  !GetAtt AwaitCompletionDlq.Arn, !GetAtt TransitionDlq.Arn]
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem,
                  dynamodb:BatchGetItem, dynamodb:ConditionCheckItem, dynamodb:TransactWriteItems,
                  dynamodb:Query, dynamodb:DescribeTable]
                Resource: !Ref SemanticDynamoResourceArns

  WakeupRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: callback-binding-and-wakeup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - !If
                - HardenedProfile
                - {Effect: Allow, Action: kms:Decrypt, Resource: !Ref SemanticKmsKeyArns}
                - !Ref 'AWS::NoValue'
              - !If
                - SecretsManagerSigning
                - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref SigningSecretAccessArns}
                - {Effect: Allow, Action: 'ssm:GetParameter', Resource: !Ref SigningParameterAccessArns}
              - !If
                - SecretsManagerSigning
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref SigningKmsAccessArns
                  Condition:
                    StringEquals: {kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'}
                    StringLike:
                      kms:EncryptionContext:SecretARN: !Ref SigningSecretAccessArns
                - !Ref 'AWS::NoValue'
              - !If
                - HardenedProfile
                - {Effect: Allow, Action: [kms:Decrypt, kms:GenerateDataKey], Resource: !Ref HostKmsKeyArn}
                - Effect: Allow
                  Action: [kms:Decrypt, kms:GenerateDataKey]
                  Resource: !Ref HostKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub 'sqs.${AWS::Region}.amazonaws.com'
                      kms:EncryptionContext:aws:sqs:arn: !GetAtt RepairFailureDlq.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RepairFailureDlq.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:ConditionCheckItem, dynamodb:Query]
                Resource:
                  - !GetAtt CallbackBindingTable.Arn
                  - !Sub '${CallbackBindingTable.Arn}/index/provider-execution-index'
                  - !Sub '${CallbackBindingTable.Arn}/index/provider-registration-index'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query]
                Resource: !Ref SemanticDynamoResourceArns
              - Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator, dynamodb:ListStreams]
                Resource: [!Ref AwaitInteractionStreamArn, !Ref ExecutionStateStreamArn, !GetAtt CallbackBindingTable.StreamArn]
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt StreamFailureDlq.Arn
              - Effect: Allow
                Action: [lambda:GetDurableExecution, lambda:GetDurableExecutionHistory,
                  lambda:SendDurableExecutionCallbackSuccess, lambda:SendDurableExecutionCallbackFailure, lambda:InvokeFunction]
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-durable:*'
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-action:*'

  DurableFunction:
    Type: AWS::Lambda::Function
    # After stack deletion, redeploying the same stack name conflicts with this retained,
    # fixed-name function. Once its executions and recovery windows have expired,
    # manually delete the retained function before deploying that stack name again.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cfn-lint: {config: {ignore_checks: [E3002]}}
    Properties:
      FunctionName: !Sub '${AWS::StackName}-durable'
      LoggingConfig: {LogGroup: !Ref DurableFunctionLogs}
      Code: {S3Bucket: !Ref DurableArtifactBucket, S3Key: !Ref DurableArtifactKey}
      Handler: org.pipelineframework.aws.durable.AwsDurableCoordinatorHandler::handleRequest
      Runtime: java21
      Architectures: [arm64]
      Role: !GetAtt DurableRole.Arn
      MemorySize: 1024
      Timeout: 900
      DeadLetterConfig: {TargetArn: !GetAtt DurableDlq.Arn}
      KmsKeyArn: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue']
      ReservedConcurrentExecutions: 32
      DurableConfig:
        KMSKeyArn: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue']
        ExecutionTimeout: !Ref DurableExecutionTimeoutSeconds
        RetentionPeriodInDays: !Ref DurableRetentionDays
      Environment:
        Variables: {TPF_AWS_DURABLE_ACTION_FUNCTION: !Ref ActionVersion, TPF_AWS_DURABLE_PUBLICATION_ID: !Ref VersionPublicationId}

  DurableVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RuntimePolicy: {UpdateRuntimeOn: FunctionUpdate}
      FunctionName: !Ref DurableFunction
      CodeSha256: !Ref DurableCodeSha256
      Description: !Sub 'TPF AWS Durable ${VersionPublicationId}; action ${ActionVersion.Version}'
  DurableAliasResource:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Alias
    Properties:
      Name: !Ref DurableAlias
      FunctionName: !Ref DurableFunction
      FunctionVersion: !GetAtt DurableVersion.Version

  ActionFunction: &ActionFunction
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Serverless::Function
    Properties: &ActionProperties
      FunctionName: !Sub '${AWS::StackName}-action'
      LoggingConfig: {LogGroup: !Ref ActionFunctionLogs}
      CodeUri: !Ref ActionArtifactUri
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      Role: !GetAtt ActionRole.Arn
      MemorySize: 1536
      Timeout: 120
      ReservedConcurrentExecutions: 32
      KmsKeyArn: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue']
      Environment:
        Variables: &ActionEnvironment
          # Environment changes qualify a new publication even when the package SHA is unchanged.
          TPF_AWS_DURABLE_PUBLICATION_ID: !Ref VersionPublicationId
          TPF_AWS_DURABLE_CONFIGURATION: !Sub |
            {"mode":"QUEUE_ASYNC","strict-startup":"true","idempotency-policy":"CLIENT_KEY_REQUIRED","state-provider":"dynamo","dispatcher-provider":"sqs","dlq-provider":"sqs","pipeline-id":"${PipelineId}","release-version":"${ReleaseVersion}","dynamo.execution-table":"${ExecutionTable}","dynamo.execution-key-table":"${ExecutionKeyTable}","dynamo.execution-payload-table":"${ExecutionPayloadTable}","dynamo.await-interaction-table":"${AwaitInteractionTable}","dynamo.await-interaction-key-table":"${AwaitInteractionKeyTable}","dynamo.await-completion-lifecycle-table":"${AwaitCompletionLifecycleTable}","dynamo.await-unit-table":"${AwaitUnitTable}","dynamo.await-admission-table":"${AwaitAdmissionTable}","dynamo.release-table":"${ReleaseTable}","dynamo.worker-table":"${WorkerTable}","dynamo.region":"${AWS::Region}","releases.registry.provider":"dynamo","releases.storage.provider":"s3","releases.storage.s3.bucket":"${ReleaseArtifactBucket}","worker.sqs.pipeline-id":"${PipelineId}","worker.sqs.contract-version":"${ContractVersion}","worker.sqs.artifact-id":"${ReleaseArtifactId}","worker.sqs.release-version":"${ReleaseVersion}","worker.sqs.artifact-digest":"${ReleaseArtifactDigest}","worker.sqs.visibility-timeout":"PT900S","coordination-host":"AWS_DURABLE","process-loops-disabled":"true","queue-url":"${WorkQueue}","dlq-url":"${WorkDlq}","worker.sqs.request-queue-url":"${TransitionRequestQueue}","worker.sqs.response-queue-url":"${TransitionResponseQueue}"}
          TPF_AWS_DURABLE_ACTION_TIMEOUT_SECONDS: !Ref DurableActionTimeoutSeconds
          TPF_AWS_DURABLE_CALLBACK_RETENTION_SECONDS: !Ref CallbackRetentionSeconds
          TPF_AWS_DURABLE_SIGNING_SOURCE: !Ref SigningSource
          TPF_AWS_DURABLE_DEPLOYMENT_VALIDATION: !Ref DeploymentPreflightValidation
          TPF_AWS_DURABLE_ESTIMATED_OPERATIONS: !Ref DurableEstimatedOperations
          TPF_AWS_DURABLE_ESTIMATED_WRITTEN_STATE_BYTES: !Ref DurableEstimatedWrittenStateBytes
          TPF_AWS_DURABLE_EXECUTION_TIMEOUT_SECONDS: !Ref DurableExecutionTimeoutSeconds
          TPF_AWS_DURABLE_RETENTION_DAYS: !Ref DurableRetentionDays
          TPF_AWS_DURABLE_WORKER_TIMEOUT_SECONDS: '900'
          TPF_AWS_DURABLE_SQS_VISIBILITY_SECONDS: '5400'
          TPF_AWS_DURABLE_RESUME_TOKEN_SECRET_ARN: !If [SecretsManagerSigning, !Ref ResumeTokenSecretArn, !Ref 'AWS::NoValue']
          TPF_AWS_DURABLE_RESUME_TOKEN_PARAMETER_ARN: !If [SecretsManagerSigning, !Ref 'AWS::NoValue', !Ref ResumeTokenParameterArn]
          TPF_AWS_DURABLE_RESUME_TOKEN_SECRET_VERSION: !If [SecretsManagerSigning, !Ref ResumeTokenSecretVersion, !Ref 'AWS::NoValue']
          TPF_AWS_DURABLE_RESUME_TOKEN_PARAMETER_VERSION: !If [SecretsManagerSigning, !Ref 'AWS::NoValue', !Ref ResumeTokenParameterVersion]
          TPF_AWS_DURABLE_WORKER_SECRET_ARN: !If [SecretsManagerSigning, !Ref WorkerSharedSecretArn, !Ref 'AWS::NoValue']
          TPF_AWS_DURABLE_WORKER_PARAMETER_ARN: !If [SecretsManagerSigning, !Ref 'AWS::NoValue', !Ref WorkerSharedParameterArn]
          TPF_AWS_DURABLE_WORKER_SECRET_VERSION: !If [SecretsManagerSigning, !Ref WorkerSharedSecretVersion, !Ref 'AWS::NoValue']
          TPF_AWS_DURABLE_WORKER_PARAMETER_VERSION: !If [SecretsManagerSigning, !Ref 'AWS::NoValue', !Ref WorkerSharedParameterVersion]
          TPF_AWS_DURABLE_BINDING_TABLE: !Ref CallbackBindingTable
          TPF_AWS_DURABLE_FUNCTION: !Sub '${AWS::StackName}-durable'
          TPF_AWS_DURABLE_QUALIFIER: !Ref DurableAlias
          QUARKUS_LAMBDA_HANDLER: !Ref ActionHandler

  ActionVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RuntimePolicy: {UpdateRuntimeOn: FunctionUpdate}
      FunctionName: !Ref ActionFunction
      CodeSha256: !Ref ActionCodeSha256
      Description: !Sub 'TPF semantic action ${VersionPublicationId}'

  IngressFunction:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Function
    Properties:
      Code: {S3Bucket: !Ref DurableArtifactBucket, S3Key: !Ref DurableArtifactKey}
      FunctionName: !Sub '${AWS::StackName}-ingress'
      LoggingConfig: {LogGroup: !Ref IngressFunctionLogs}
      KmsKeyArn: !If [HardenedProfile, !Ref HostKmsKeyArn, !Ref 'AWS::NoValue']
      ReservedConcurrentExecutions: 16
      Handler: org.pipelineframework.aws.durable.AwsDurableIngressHandler::handleRequest
      Runtime: java21
      Architectures: [arm64]
      Role: !GetAtt IngressRole.Arn
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          TPF_AWS_DURABLE_PUBLICATION_ID: !Ref VersionPublicationId
          TPF_AWS_DURABLE_FUNCTION: !Ref DurableFunction
          TPF_AWS_DURABLE_QUALIFIER: !GetAtt DurableVersion.Version

  IngressVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RuntimePolicy: {UpdateRuntimeOn: FunctionUpdate}
      FunctionName: !Ref IngressFunction
      CodeSha256: !Ref DurableCodeSha256
      Description: !Sub 'TPF ingress ${VersionPublicationId}'

  WorkFunction:
    <<: *ActionFunction
    Properties:
      <<: *ActionProperties
      FunctionName: !Sub '${AWS::StackName}-work'
      LoggingConfig: {LogGroup: !Ref WorkFunctionLogs}
      Role: !GetAtt WorkerRole.Arn
      Timeout: 900
      Environment:
        Variables: {<<: *ActionEnvironment, QUARKUS_LAMBDA_HANDLER: !Ref WorkHandler}

  AwaitCompletionFunction:
    <<: *ActionFunction
    Properties:
      <<: *ActionProperties
      FunctionName: !Sub '${AWS::StackName}-await-completion'
      LoggingConfig: {LogGroup: !Ref AwaitCompletionFunctionLogs}
      Role: !GetAtt WorkerRole.Arn
      Environment:
        Variables: {<<: *ActionEnvironment, QUARKUS_LAMBDA_HANDLER: !Ref AwaitCompletionHandler}

  TransitionWorkerFunction:
    Condition: FunctionTransitionConsumer
    <<: *ActionFunction
    Properties:
      <<: *ActionProperties
      FunctionName: !Sub '${AWS::StackName}-transition-worker'
      LoggingConfig: {LogGroup: !Ref TransitionWorkerFunctionLogs}
      Role: !GetAtt WorkerRole.Arn
      Timeout: 900
      Environment:
        Variables: {<<: *ActionEnvironment, QUARKUS_LAMBDA_HANDLER: !Ref TransitionWorkerHandler}

  AwaitWakeupFunction:
    <<: *ActionFunction
    Properties:
      <<: *ActionProperties
      FunctionName: !Sub '${AWS::StackName}-await-wakeup'
      LoggingConfig: {LogGroup: !Ref AwaitWakeupFunctionLogs}
      Role: !GetAtt WakeupRole.Arn
      Environment:
        Variables:
          <<: *ActionEnvironment
          QUARKUS_LAMBDA_HANDLER: !Ref AwaitWakeupHandler
          TPF_AWS_DURABLE_AWAIT_STREAM_ARN: !Ref AwaitInteractionStreamArn
          TPF_AWS_DURABLE_BINDING_STREAM_ARN: !GetAtt CallbackBindingTable.StreamArn

  ExecutionWakeupFunction:
    <<: *ActionFunction
    Properties:
      <<: *ActionProperties
      FunctionName: !Sub '${AWS::StackName}-execution-wakeup'
      LoggingConfig: {LogGroup: !Ref ExecutionWakeupFunctionLogs}
      Role: !GetAtt WakeupRole.Arn
      Environment:
        Variables:
          <<: *ActionEnvironment
          QUARKUS_LAMBDA_HANDLER: !Ref ExecutionWakeupHandler
          TPF_AWS_DURABLE_EXECUTION_STREAM_ARN: !Ref ExecutionStateStreamArn

  DueWorkFunction:
    <<: *ActionFunction
    Properties:
      <<: *ActionProperties
      FunctionName: !Sub '${AWS::StackName}-due-work'
      LoggingConfig: {LogGroup: !Ref DueWorkFunctionLogs}
      Role: !GetAtt DueWorkRole.Arn
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          <<: *ActionEnvironment
          QUARKUS_LAMBDA_HANDLER: !Ref DueWorkHandler
          PIPELINE_ORCHESTRATOR_SWEEP_LIMIT: !Ref DueWorkSweepLimit

  WorkVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RuntimePolicy: {UpdateRuntimeOn: FunctionUpdate}
      FunctionName: !Ref WorkFunction
      CodeSha256: !Ref ActionCodeSha256
      Description: !Sub 'TPF Work ${VersionPublicationId}'

  AwaitCompletionVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RuntimePolicy: {UpdateRuntimeOn: FunctionUpdate}
      FunctionName: !Ref AwaitCompletionFunction
      CodeSha256: !Ref ActionCodeSha256
      Description: !Sub 'TPF AwaitCompletion ${VersionPublicationId}'

  TransitionWorkerVersion:
    Type: AWS::Lambda::Version
    Condition: FunctionTransitionConsumer
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RuntimePolicy: {UpdateRuntimeOn: FunctionUpdate}
      FunctionName: !Ref TransitionWorkerFunction
      CodeSha256: !Ref ActionCodeSha256
      Description: !Sub 'TPF TransitionWorker ${VersionPublicationId}'

  AwaitWakeupVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RuntimePolicy: {UpdateRuntimeOn: FunctionUpdate}
      FunctionName: !Ref AwaitWakeupFunction
      CodeSha256: !Ref ActionCodeSha256
      Description: !Sub 'TPF AwaitWakeup ${VersionPublicationId}'

  ExecutionWakeupVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RuntimePolicy: {UpdateRuntimeOn: FunctionUpdate}
      FunctionName: !Ref ExecutionWakeupFunction
      CodeSha256: !Ref ActionCodeSha256
      Description: !Sub 'TPF ExecutionWakeup ${VersionPublicationId}'

  DueWorkVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RuntimePolicy: {UpdateRuntimeOn: FunctionUpdate}
      FunctionName: !Ref DueWorkFunction
      CodeSha256: !Ref ActionCodeSha256
      Description: !Sub 'TPF DueWork ${VersionPublicationId}'

  ReconciliationVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RuntimePolicy: {UpdateRuntimeOn: FunctionUpdate}
      FunctionName: !Ref ReconciliationFunction
      CodeSha256: !Ref ActionCodeSha256
      Description: !Sub 'TPF Reconciliation ${VersionPublicationId}'

  WorkFunctionWork:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref WorkVersion
      EventSourceArn: !GetAtt WorkQueue.Arn
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig: {MaximumConcurrency: 32}

  AwaitCompletionFunctionAwaitCompletion:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref AwaitCompletionVersion
      EventSourceArn: !GetAtt AwaitCompletionQueue.Arn
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig: {MaximumConcurrency: 32}

  TransitionWorkerFunctionTransition:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Condition: FunctionTransitionConsumer
    Properties:
      FunctionName: !Ref TransitionWorkerVersion
      EventSourceArn: !GetAtt TransitionRequestQueue.Arn
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig: {MaximumConcurrency: 32}

  DueWorkFunctionTick:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref DueWorkVersion
      EventSourceArn: !GetAtt DueWorkQueue.Arn
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig: {MaximumConcurrency: 2}

  AwaitWakeupFunctionAwaitState:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties: &StreamMapping
      FunctionName: !Ref AwaitWakeupVersion
      EventSourceArn: !Ref AwaitInteractionStreamArn
      StartingPosition: TRIM_HORIZON
      BatchSize: 10
      BisectBatchOnFunctionError: true
      MetricsConfig: {Metrics: [EventCount]}
      MaximumRecordAgeInSeconds: 3600
      MaximumRetryAttempts: 5
      FunctionResponseTypes: [ReportBatchItemFailures]
      DestinationConfig: {OnFailure: {Destination: !GetAtt StreamFailureDlq.Arn}}
  AwaitWakeupFunctionCallbackBinding:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      <<: *StreamMapping
      EventSourceArn: !GetAtt CallbackBindingTable.StreamArn
  ExecutionWakeupFunctionExecutionState:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      <<: *StreamMapping
      FunctionName: !Ref ExecutionWakeupVersion
      EventSourceArn: !Ref ExecutionStateStreamArn

  DueWorkRule:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: 'rate(1 minute)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt DueWorkQueue.Arn
          Id: bounded-semantic-due-work
          Input: '{"kind":"tpf-due-work-tick"}'
          RetryPolicy: {MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 10}
          DeadLetterConfig: {Arn: !GetAtt DueWorkDlq.Arn}
  DueWorkQueuePolicy:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref DueWorkQueue, !Ref DueWorkDlq]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource: [!GetAtt DueWorkQueue.Arn, !GetAtt DueWorkDlq.Arn]
            Condition: {ArnEquals: {'aws:SourceArn': !GetAtt DueWorkRule.Arn}}

  ReconciliationFunction:
    <<: *ActionFunction
    Properties:
      <<: *ActionProperties
      FunctionName: !Sub '${AWS::StackName}-reconcile'
      LoggingConfig: {LogGroup: !Ref ReconciliationFunctionLogs}
      Role: !GetAtt WakeupRole.Arn
      ReservedConcurrentExecutions: 2
      Environment:
        Variables: {<<: *ActionEnvironment, QUARKUS_LAMBDA_HANDLER: !Ref ReconciliationHandler}

  ReconciliationInvokeConfig:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ReconciliationFunction
      Qualifier: !GetAtt ReconciliationVersion.Version
      MaximumEventAgeInSeconds: 3600
      MaximumRetryAttempts: 2
      DestinationConfig: {OnFailure: {Destination: !GetAtt RepairFailureDlq.Arn}}
  IngressInvokeConfig:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref IngressFunction
      Qualifier: !GetAtt IngressVersion.Version
      MaximumEventAgeInSeconds: 3600
      MaximumRetryAttempts: 2
      DestinationConfig: {OnFailure: {Destination: !GetAtt DurableDlq.Arn}}
  RepairFailureDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600, KmsMasterKeyId: !Ref HostKmsKeyArn}
  RepairFailureQueuePolicy:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref RepairFailureDlq]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt RepairFailureDlq.Arn
            Condition:
              ArnEquals: {aws:SourceArn: !GetAtt DurableTerminalRule.Arn}
  DurableTerminalRule:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: [aws.lambda]
        detail-type: ['Durable Execution Status Change']
        detail:
          functionArn:
            - prefix: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-durable:'
      Targets:
        - Arn: !Ref ReconciliationVersion
          Id: targeted-durable-reconciliation
          RetryPolicy: {MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 5}
          DeadLetterConfig: {Arn: !GetAtt RepairFailureDlq.Arn}
  DurableTerminalPermission:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReconciliationVersion
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DurableTerminalRule.Arn

