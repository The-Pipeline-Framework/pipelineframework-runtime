version: 3
appName: "Search Pipeline"
basePackage: "org.pipelineframework.search"
transport: "REST"
types:
  CrawlRequest:
    java: org.pipelineframework.search.domain.CrawlRequest
    fields: []
  RawDocument:
    java: org.pipelineframework.search.domain.RawDocument
    fields: []
  ParsedDocument:
    java: org.pipelineframework.search.domain.ParsedDocument
    fields: []
  TokenBatch:
    java: org.pipelineframework.search.domain.TokenBatch
    fields: []
  IndexAck:
    java: org.pipelineframework.search.domain.IndexAck
    fields: []
steps:
  - name: "Crawl Source"
    service: "org.pipelineframework.search.ProcessCrawlSourceService"
    cardinality: ONE_TO_ONE
    input: CrawlRequest
    output: RawDocument
  - name: "Parse Document"
    service: "org.pipelineframework.search.ProcessParseDocumentService"
    cardinality: ONE_TO_ONE
    input: RawDocument
    output: ParsedDocument
  - name: "Tokenize Content"
    service: "org.pipelineframework.search.ProcessTokenizeContentService"
    cardinality: ONE_TO_ONE
    input: ParsedDocument
    output: TokenBatch
  - name: "Index Document"
    service: "org.pipelineframework.search.ProcessIndexDocumentService"
    cardinality: ONE_TO_ONE
    input: TokenBatch
    output: IndexAck

aspects:
  persistence:
    enabled: true
    scope: "GLOBAL"
    position: "AFTER_STEP"
    order: 0
    config:
      pluginImplementationClass: "org.pipelineframework.plugin.persistence.PersistenceService"
  cache:
    enabled: true
    scope: "GLOBAL"
    position: "AFTER_STEP"
    order: 5
  cache-invalidate:
    enabled: true
    scope: "STEPS"
    position: "BEFORE_STEP"
    order: -4
    config:
      targetSteps:
        - "ProcessTokenizeContentService"
      pluginImplementationClass: "org.pipelineframework.plugin.cache.CacheInvalidationService"
  cache-invalidate-all:
    enabled: true
    scope: "STEPS"
    position: "BEFORE_STEP"
    order: -5
    config:
      targetSteps:
        - "ProcessParseDocumentService"
      pluginImplementationClass: "org.pipelineframework.plugin.cache.CacheInvalidationAllService"
