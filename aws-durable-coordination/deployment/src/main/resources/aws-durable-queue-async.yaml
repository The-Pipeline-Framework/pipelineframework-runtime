      MetricName: DroppedEventCount
      Dimensions: [{Name: EventSourceMappingUUID, Value: !Ref ExecutionWakeupFunctionExecutionState}]
  ExecutionStreamAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      MetricName: IteratorAge
      Statistic: Maximum
      Threshold: 60000
      Dimensions: [{Name: FunctionName, Value: !Ref ExecutionWakeupFunction}]
  ExecutionStreamDestinationDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      MetricName: DestinationDeliveryFailures
      Dimensions: [{Name: FunctionName, Value: !Ref ExecutionWakeupFunction}]
  DueWorkDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *QueueAlarmProperties
      Dimensions: [{Name: QueueName, Value: !GetAtt DueWorkDlq.QueueName}]
  DueWorkAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *QueueAlarmProperties
      MetricName: ApproximateAgeOfOldestMessage
      Statistic: Maximum
      Threshold: 120
      Dimensions: [{Name: QueueName, Value: !GetAtt DueWorkQueue.QueueName}]
  DueWorkDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *ReconciliationFunctionAlarmProperties
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions: [{Name: RuleName, Value: !Ref DueWorkRule}]

  CompletionObservationUnknownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *ActionFunctionAlarmProperties
      AlarmDescription: Native completion observations could not establish release; sampled reads do not constitute a global inventory
      Namespace: TPF/AwsDurable
      MetricName: CompletionObservationCount
      Period: 300
      Threshold: 0
      Dimensions: [{Name: Stage, Value: COMPLETION}, {Name: Outcome, Value: UNKNOWN}]
  CompletionObservationOutstandingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *ActionFunctionAlarmProperties
      AlarmDescription: Observed outstanding native completions exceed the configured read-count threshold; repeated reads count separately and absent samples do not establish global zero or health
      Namespace: TPF/AwsDurable
      MetricName: CompletionObservationCount
      Statistic: Sum
      Period: 300
      Threshold: !Ref OutstandingCompletionObservationAlarmCount
      Dimensions: [{Name: Stage, Value: COMPLETION}, {Name: Outcome, Value: OUTSTANDING}]
  CompletionReleaseLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *ActionFunctionAlarmProperties
      AlarmDescription: Maximum known native admission-to-release latency among sampled released completions; absence of samples does not establish health
      Namespace: TPF/AwsDurable
      MetricName: AdmissionToReleaseLatencyMilliseconds
      Statistic: Maximum
      Period: 300
      Threshold: !Ref CompletionReleaseLatencyAlarmMilliseconds
      Dimensions: [{Name: Stage, Value: COMPLETION}, {Name: Outcome, Value: RELEASED}]
  CallbackResumeObservedLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *ActionFunctionAlarmProperties
      AlarmDescription: Maximum host API-success observation to first verified resumed action sample; missing or lost samples do not establish provider latency or health
      Namespace: TPF/AwsDurable
      MetricName: CallbackToFirstResumedActionMilliseconds
      Statistic: Maximum
      Period: 300
      Threshold: !Ref CallbackResumeLatencyAlarmMilliseconds
      Dimensions: [{Name: Stage, Value: CALLBACK_RESUME}, {Name: Outcome, Value: MEASURED}]
  CallbackResumeUnknownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *ActionFunctionAlarmProperties
      AlarmDescription: Callback resume observations have invalid timestamps; this sample cannot measure lost acknowledgements or missing history timestamps
      Namespace: TPF/AwsDurable
      MetricName: CallbackResumeUnknownCount
      Period: 300
      Threshold: 0
      Dimensions: [{Name: Stage, Value: CALLBACK_RESUME}, {Name: Outcome, Value: UNKNOWN}]
  RepairObservedAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *ReconciliationFunctionAlarmProperties
      AlarmDescription: Maximum repair age sampled from the first retained host observation on targeted attempts; missing samples or accepted replacement do not establish convergence
      Namespace: TPF/AwsDurable
      MetricName: RepairAgeMilliseconds
      Statistic: Maximum
      Period: 300
      Threshold: !Ref RepairAgeAlarmMilliseconds
      Dimensions: [{Name: Stage, Value: REPAIR}, {Name: Outcome, Value: REPAIR_AGE_SAMPLED}]
  RepairObservedAgeUnknownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *ReconciliationFunctionAlarmProperties
      AlarmDescription: Targeted repair age samples are missing or invalid; retry exhaustion and DLQs remain separate alarms
      Namespace: TPF/AwsDurable
      MetricName: RepairAgeUnknownCount
      Period: 300
      Threshold: 0
      Dimensions: [{Name: Stage, Value: REPAIR}, {Name: Outcome, Value: REPAIR_AGE_UNKNOWN}]
  WakeupProviderUnknownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: WAKEUP}, {Name: Outcome, Value: PROVIDER_UNKNOWN}]
  WakeupTransientFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: WAKEUP}, {Name: Outcome, Value: TRANSIENT_FAILURE}]
  ReplacementRejectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: REPLACEMENT}, {Name: Outcome, Value: REJECTED}]
  ReplacementFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: REPLACEMENT}, {Name: Outcome, Value: FAILED}]
  RepairFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: REPAIR}, {Name: Outcome, Value: FAILED}]

  IngressDestinationDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *IngressFunctionAlarmProperties
      MetricName: DestinationDeliveryFailures
  RepairDestinationDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *ReconciliationFunctionAlarmProperties
      MetricName: DestinationDeliveryFailures
  DurableDeadLetterDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *DurableFunctionAlarmProperties
      MetricName: DeadLetterErrors

  CallbackBindingConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: BINDING}, {Name: Outcome, Value: CONFLICT}]
  CallbackRegistrationConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: REGISTRATION}, {Name: Outcome, Value: CONFLICT}]
  GenerationClaimConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: GENERATION}, {Name: Outcome, Value: CONFLICT}]
  StaleGenerationRejectionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: GENERATION}, {Name: Outcome, Value: STALE_REJECTED}]

Outputs:
  TransitionWorkerPlacement: {Value: !Ref TransitionWorkerPlacement}
  TransitionWorkerProtocolIdentity: {Value: !Sub '${PipelineId}/${ContractVersion}/${ReleaseVersion}/${ReleaseArtifactId}/${ReleaseArtifactDigest}'}
  DurableAliasArn: {Value: !Ref DurableAliasResource}
  IngressFunctionArn: {Value: !Ref IngressVersion}
  ActionFunctionArn: {Value: !Ref ActionVersion}
  CallbackBindingTableName: {Value: !Ref CallbackBindingTable}
  WorkQueueUrl: {Value: !Ref WorkQueue}
  AwaitCompletionQueueUrl: {Value: !Ref AwaitCompletionQueue}
  TransitionRequestQueueUrl: {Value: !Ref TransitionRequestQueue}
  TransitionResponseQueueUrl: {Value: !Ref TransitionResponseQueue}
  StreamFailureQueueUrl: {Value: !Ref StreamFailureDlq}
  DueWorkQueueUrl: {Value: !Ref DueWorkQueue}
  DueWorkDlqUrl: {Value: !Ref DueWorkDlq}
  DeploymentReleaseManifest:
    Description: Export this resolved manifest to the immutable release bundle before admission; never overwrite a prior publication manifest
    Value: !Sub
      - |
        {"schemaVersion":1,"stackId":"${AWS::StackId}","pipelineId":"${PipelineId}","contractVersion":"${ContractVersion}","releaseId":"${ReleaseVersion}","artifactId":"${ReleaseArtifactId}","artifactSha256":"${ReleaseArtifactDigest}","actionCodeSha256":"${ActionCodeSha256}","durableCodeSha256":"${DurableCodeSha256}","publicationId":"${VersionPublicationId}","placement":"${TransitionWorkerPlacement}","isolationMode":"${ReleaseIsolationMode}","runtimeUpdateMode":"FunctionUpdate","functionVersionArns":{"durable":"${DurableVersion}","action":"${ActionVersion}","ingress":"${IngressVersion}","work":"${WorkVersion}","transition":"${TransitionVersionArn}","awaitCompletion":"${AwaitCompletionVersion}","awaitWakeup":"${AwaitWakeupVersion}","executionWakeup":"${ExecutionWakeupVersion}","dueWork":"${DueWorkVersion}","reconciliation":"${ReconciliationVersion}"},"queueUrls":{"work":"${WorkQueue}","workDlq":"${WorkDlq}","awaitCompletion":"${AwaitCompletionQueue}","awaitCompletionDlq":"${AwaitCompletionDlq}","transitionRequest":"${TransitionRequestQueue}","transitionResponse":"${TransitionResponseQueue}","transitionDlq":"${TransitionDlq}","dueWork":"${DueWorkQueue}","dueWorkDlq":"${DueWorkDlq}","streamFailure":"${StreamFailureDlq}","repairFailure":"${RepairFailureDlq}","durableDlq":"${DurableDlq}"},"mappingIds":{"work":"${WorkFunctionWork}","awaitCompletion":"${AwaitCompletionFunctionAwaitCompletion}","transition":"${TransitionMappingId}","awaitState":"${AwaitWakeupFunctionAwaitState}","callbackBinding":"${AwaitWakeupFunctionCallbackBinding}","executionState":"${ExecutionWakeupFunctionExecutionState}","dueWork":"${DueWorkFunctionTick}"},"signing":{"resumeToken":{"arn":"${ResumeTokenSecretArn}","versionId":"${ResumeTokenSecretVersion}"},"worker":{"arn":"${WorkerSharedSecretArn}","versionId":"${WorkerSharedSecretVersion}"},"currentKmsKeyArn":"${SigningKmsKeyArn}","retainedSecretAccessArns":["${SigningSecretArns}"],"retainedKmsAccessArns":["${SigningKeyArns}"]},"hostKmsKeyArn":"${HostKmsKeyArn}","semanticKmsKeyArns":["${SemanticKeyArns}"]}
      - TransitionVersionArn: !If [FunctionTransitionConsumer, !Ref TransitionWorkerVersion, '']
        TransitionMappingId: !If [FunctionTransitionConsumer, !Ref TransitionWorkerFunctionTransition, '']
        SigningSecretArns: !Join ['","', !Ref SigningSecretAccessArns]
        SigningKeyArns: !Join ['","', !Ref SigningKmsAccessArns]
        SemanticKeyArns: !Join ['","', !Ref SemanticKmsKeyArns]
