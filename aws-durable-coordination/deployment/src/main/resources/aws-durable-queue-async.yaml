      Dimensions: [{Name: Stage, Value: CALLBACK_RESUME}, {Name: Outcome, Value: UNKNOWN}]
  RepairObservedAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *ReconciliationFunctionAlarmProperties
      AlarmDescription: Maximum repair age sampled from the first retained host observation on targeted attempts; missing samples or accepted replacement do not establish convergence
      Namespace: TPF/AwsDurable
      MetricName: RepairAgeMilliseconds
      Statistic: Maximum
      Period: 300
      Threshold: !Ref RepairAgeAlarmMilliseconds
      Dimensions: [{Name: Stage, Value: REPAIR}, {Name: Outcome, Value: REPAIR_AGE_SAMPLED}]
  RepairObservedAgeUnknownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *ReconciliationFunctionAlarmProperties
      AlarmDescription: Targeted repair age samples are missing or invalid; retry exhaustion and DLQs remain separate alarms
      Namespace: TPF/AwsDurable
      MetricName: RepairAgeUnknownCount
      Period: 300
      Threshold: 0
      Dimensions: [{Name: Stage, Value: REPAIR}, {Name: Outcome, Value: REPAIR_AGE_UNKNOWN}]
  WakeupProviderUnknownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: WAKEUP}, {Name: Outcome, Value: PROVIDER_UNKNOWN}]
  WakeupTransientFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: WAKEUP}, {Name: Outcome, Value: TRANSIENT_FAILURE}]
  ReplacementRejectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: REPLACEMENT}, {Name: Outcome, Value: REJECTED}]
  ReplacementFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: REPLACEMENT}, {Name: Outcome, Value: FAILED}]
  RepairFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: REPAIR}, {Name: Outcome, Value: FAILED}]

  IngressDestinationDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *IngressFunctionAlarmProperties
      MetricName: DestinationDeliveryFailures
  RepairDestinationDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *ReconciliationFunctionAlarmProperties
      MetricName: DestinationDeliveryFailures
  DurableDeadLetterDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *DurableFunctionAlarmProperties
      MetricName: DeadLetterErrors

  CallbackBindingConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: BINDING}, {Name: Outcome, Value: CONFLICT}]
  CallbackRegistrationConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: REGISTRATION}, {Name: Outcome, Value: CONFLICT}]
  GenerationClaimConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: GENERATION}, {Name: Outcome, Value: CONFLICT}]
  StaleGenerationRejectionAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HardenedProfile
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      Namespace: TPF/AwsDurable
      MetricName: HostOutcomeCount
      Period: 300
      Threshold: 5
      Dimensions: [{Name: Stage, Value: GENERATION}, {Name: Outcome, Value: STALE_REJECTED}]

Outputs:
  TransitionWorkerPlacement: {Value: !Ref TransitionWorkerPlacement}
  TransitionWorkerProtocolIdentity: {Value: !Sub '${PipelineId}/${ContractVersion}/${ReleaseVersion}/${ReleaseArtifactId}/${ReleaseArtifactDigest}'}
  DurableAliasArn: {Value: !Ref DurableAliasResource}
  IngressFunctionArn: {Value: !Ref IngressVersion}
  ActionFunctionArn: {Value: !Ref ActionVersion}
  CallbackBindingTableName: {Value: !Ref CallbackBindingTable}
  WorkQueueUrl: {Value: !Ref WorkQueue}
  AwaitCompletionQueueUrl: {Value: !Ref AwaitCompletionQueue}
  TransitionRequestQueueUrl: {Value: !Ref TransitionRequestQueue}
  TransitionResponseQueueUrl: {Value: !Ref TransitionResponseQueue}
  StreamFailureQueueUrl: {Value: !Ref StreamFailureDlq}
  DueWorkQueueUrl: {Value: !Ref DueWorkQueue}
  DueWorkDlqUrl: {Value: !Ref DueWorkDlq}
  DeploymentReleaseManifest:
    Description: Export this resolved manifest to the immutable release bundle before admission; never overwrite a prior publication manifest
    Value: !Sub
      - |
        {"schemaVersion":2,"deploymentProfile":"${DeploymentProfile}","observability":"${ObservationMode}","scheduleProvider":"EVENTBRIDGE_RULE","encryption":{"host":"${HostEncryptionMode}","semantic":"${SemanticEncryptionMode}"},"stackId":"${AWS::StackId}","pipelineId":"${PipelineId}","contractVersion":"${ContractVersion}","releaseId":"${ReleaseVersion}","artifactId":"${ReleaseArtifactId}","artifactSha256":"${ReleaseArtifactDigest}","actionCodeSha256":"${ActionCodeSha256}","durableCodeSha256":"${DurableCodeSha256}","publicationId":"${VersionPublicationId}","placement":"${TransitionWorkerPlacement}","isolationMode":"${ReleaseIsolationMode}","runtimeUpdateMode":"FunctionUpdate","functionVersionArns":{"durable":"${DurableVersion}","action":"${ActionVersion}","ingress":"${IngressVersion}","work":"${WorkVersion}","transition":"${TransitionVersionArn}","awaitCompletion":"${AwaitCompletionVersion}","awaitWakeup":"${AwaitWakeupVersion}","executionWakeup":"${ExecutionWakeupVersion}","dueWork":"${DueWorkVersion}","reconciliation":"${ReconciliationVersion}"},"logGroupNames":{"durable":"${DurableFunctionLogs}","action":"${ActionFunctionLogs}","ingress":"${IngressFunctionLogs}","work":"${WorkFunctionLogs}","transition":"${TransitionLogGroupName}","awaitCompletion":"${AwaitCompletionFunctionLogs}","awaitWakeup":"${AwaitWakeupFunctionLogs}","executionWakeup":"${ExecutionWakeupFunctionLogs}","dueWork":"${DueWorkFunctionLogs}","reconciliation":"${ReconciliationFunctionLogs}"},"queueUrls":{"work":"${WorkQueue}","workDlq":"${WorkDlq}","awaitCompletion":"${AwaitCompletionQueue}","awaitCompletionDlq":"${AwaitCompletionDlq}","transitionRequest":"${TransitionRequestQueue}","transitionResponse":"${TransitionResponseQueue}","transitionDlq":"${TransitionDlq}","dueWork":"${DueWorkQueue}","dueWorkDlq":"${DueWorkDlq}","streamFailure":"${StreamFailureDlq}","repairFailure":"${RepairFailureDlq}","durableDlq":"${DurableDlq}"},"mappingIds":{"work":"${WorkFunctionWork}","awaitCompletion":"${AwaitCompletionFunctionAwaitCompletion}","transition":"${TransitionMappingId}","awaitState":"${AwaitWakeupFunctionAwaitState}","callbackBinding":"${AwaitWakeupFunctionCallbackBinding}","executionState":"${ExecutionWakeupFunctionExecutionState}","dueWork":"${DueWorkFunctionTick}"},"signing":${SigningManifest},"hostKmsKeyArn":"${HostKmsKeyArn}","semanticKmsKeyArns":${SemanticKeysManifest}}
      - ObservationMode: !If [HardenedProfile, ALARMS, SUPERVISED_NO_ALARMS]
        HostEncryptionMode: !If [HardenedProfile, CUSTOMER_MANAGED, SERVICE_OWNED_EXCEPT_EVENTBRIDGE_CMK]
        SemanticEncryptionMode: !If [HardenedProfile, CUSTOMER_MANAGED, AWS_OWNED_AND_S3_MANAGED]
        SigningManifest: !If
          - SecretsManagerSigning
          - !Sub
            - '{"resumeToken":{"arn":"${ResumeTokenSecretArn}","versionId":"${ResumeTokenSecretVersion}"},"worker":{"arn":"${WorkerSharedSecretArn}","versionId":"${WorkerSharedSecretVersion}"},"currentKmsKeyArn":"${SigningKmsKeyArn}","retainedSecretAccessArns":["${SigningSecretArns}"],"retainedKmsAccessArns":["${SigningKeyArns}"],"source":"SECRETS_MANAGER"}'
            - SigningSecretArns: !Join ['","', !Ref SigningSecretAccessArns]
              SigningKeyArns: !Join ['","', !Ref SigningKmsAccessArns]
          - !Sub
            - '{"source":"SSM_STANDARD","tier":"Standard","type":"SecureString","keyKind":"AWS_MANAGED_SSM","lifecycle":"IMMUTABLE_GENERATION","resumeToken":{"arn":"${ResumeTokenParameterArn}","version":${ResumeTokenParameterVersion}},"worker":{"arn":"${WorkerSharedParameterArn}","version":${WorkerSharedParameterVersion}},"retainedParameterAccessArns":["${ParameterArns}"]}'
            - ParameterArns: !Join ['","', !Ref SigningParameterAccessArns]
        TransitionVersionArn: !If [FunctionTransitionConsumer, !Ref TransitionWorkerVersion, '']
        TransitionLogGroupName: !If [FunctionTransitionConsumer, !Ref TransitionWorkerFunctionLogs, '']
        TransitionMappingId: !If [FunctionTransitionConsumer, !Ref TransitionWorkerFunctionTransition, '']
        SemanticKeysManifest: !If
          - HardenedProfile
          - !Sub
            - '["${SemanticKeyArns}"]'
            - SemanticKeyArns: !Join ['","', !Ref SemanticKmsKeyArns]
          - '[]'
