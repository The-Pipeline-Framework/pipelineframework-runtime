  AwaitWakeupFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: &AwaitWakeupFunctionAlarmProperties
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions: [{Name: FunctionName, Value: !Sub '${AWS::StackName}-await-wakeup'}]
  AwaitWakeupFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      MetricName: Throttles
  ReconciliationFunctionLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-reconcile'
      KmsKeyId: !Ref HostKmsKeyArn
      RetentionInDays: !Ref LogRetentionDays
  ReconciliationFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: &ReconciliationFunctionAlarmProperties
