AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: Shared AWS Durable coordination for independently deployed REST workers
Parameters:
  CodeBucket: {Type: String}
  DriverCodeKey: {Type: String}
  DriverCodeObjectVersion: {Type: String}
  DriverCodeSha256: {Type: String}
  ActionCodeKey: {Type: String}
  ActionCodeObjectVersion: {Type: String}
  ActionCodeSha256: {Type: String}
  LifecycleCodeKey: {Type: String}
  LifecycleCodeObjectVersion: {Type: String}
  LifecycleCodeSha256: {Type: String}
  PlatformPublication: {Type: String}
  DurableAlias: {Type: String, Default: platform}
  DurableExecutionTimeoutSeconds: {Type: Number, Default: 86400}
  DurableRetentionDays: {Type: Number, Default: 30}
  ResumeTokenSecretArn: {Type: String}
  ResumeTokenSecretVersion: {Type: String}
  WorkerSigningSecretArns: {Type: CommaDelimitedList, Default: ''}
  WorkerAliasArns: {Type: CommaDelimitedList, Default: ''}
  WorkerVersionArns: {Type: CommaDelimitedList, Default: ''}
  WorkerTargetKey: {Type: String, Default: ''}
  WorkerTargetVersion: {Type: String, Default: ''}
  RefreshableWorkerTargets: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}
  WorkerFunctionNamePrefix: {Type: String, Default: '', AllowedPattern: '^$|^[A-Za-z0-9_-]+-$'}
  WorkerSigningSecretNamePrefix: {Type: String, Default: '', AllowedPattern: '^$|^tpf/worker-signing/[A-Za-z0-9_-]+/$'}
  RetainedWorkerTargetGrantSlots:
    Type: CommaDelimitedList
    Default: '0'
    AllowedPattern: '[0-9]+'
    Description: Zero-based indices of retained routing objects, in order
  RetainedWorkerTargetGrants:
    Type: CommaDelimitedList
    Default: ''
    AllowedPattern: '^$|^tpf/rest-targets/[A-Za-z0-9._-]+[.]properties[|][^|]+$'
    Description: Retained routing object key and exact version pairs separated by a vertical bar
  ReleaseArtifactBucket: {Type: String}
  SemanticDynamoResourceArns: {Type: CommaDelimitedList}
  ExecutionTable: {Type: String}
  ExecutionKeyTable: {Type: String}
  ExecutionPayloadTable: {Type: String}
  AwaitInteractionTable: {Type: String}
  AwaitInteractionKeyTable: {Type: String}
  AwaitCompletionLifecycleTable: {Type: String}
  AwaitUnitTable: {Type: String}
  AwaitAdmissionTable: {Type: String}
  ReleaseTable: {Type: String}
  WorkerTable: {Type: String}
  AwaitInteractionStreamArn: {Type: String}
  ExecutionStateStreamArn: {Type: String}
Rules:
  RefreshableRoutingRequiresFixedScope:
    RuleCondition: !Equals [!Ref RefreshableWorkerTargets, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref WorkerTargetKey, '']]
        AssertDescription: Refreshable routing needs a stable object key
      - Assert: !Not [!Equals [!Ref WorkerFunctionNamePrefix, '']]
        AssertDescription: Refreshable routing needs a dedicated worker function namespace
      - Assert: !Not [!Equals [!Ref WorkerSigningSecretNamePrefix, '']]
        AssertDescription: Refreshable routing needs a dedicated credential namespace
      - Assert: !Equals [!Ref WorkerTargetVersion, '']
        AssertDescription: Refreshable routing uses the versioned head at the configured key
Conditions:
  RefreshableTargets: !Equals [!Ref RefreshableWorkerTargets, 'true']
  HasWorkerTargets: !And [!Not [!Condition RefreshableTargets], !Not [!Equals [!Join ['', !Ref WorkerAliasArns], '']]]
  HasRetainedWorkerTargets: !And [!Not [!Condition RefreshableTargets], !Not [!Equals [!Join ['', !Ref RetainedWorkerTargetGrants], '']]]
Resources:
  'Fn::ForEach::RetainedWorkerTargetReadPolicies':
    - Slot
    - !Ref RetainedWorkerTargetGrantSlots
    - 'RetainedWorkerTargetReadPolicy${Slot}':
        Type: AWS::IAM::Policy
        Condition: HasRetainedWorkerTargets
        Properties:
          PolicyName: !Sub '${AWS::StackName}-retained-routing-${Slot}'
          Roles: [!Ref CoordinationRole]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObjectVersion
                Resource: !Sub
                  - 'arn:${AWS::Partition}:s3:::${ReleaseArtifactBucket}/${ObjectKey}'
                  - ObjectKey: !Select [0, !Split ['|', !Select [!Ref Slot, !Ref RetainedWorkerTargetGrants]]]
                Condition:
                  StringEquals:
                    s3:VersionId: !Select [1, !Split ['|', !Select [!Ref Slot, !Ref RetainedWorkerTargetGrants]]]
  CallbackBindingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SSESpecification: {SSEEnabled: true}
      DeletionProtectionEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: provider_execution_arn, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      # For existing tables, add provider-registration-index and wait for ACTIVE
      # before upgrading the repair host. Existing records need no backfill.
      # Keep provider-execution-index while retained host versions still use it.
      GlobalSecondaryIndexes:
        - IndexName: provider-execution-index
          KeySchema: [{AttributeName: provider_execution_arn, KeyType: HASH}]
          Projection: {ProjectionType: ALL}
        - IndexName: provider-registration-index
          KeySchema:
            - {AttributeName: provider_execution_arn, KeyType: HASH}
            - {AttributeName: sk, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      StreamSpecification: {StreamViewType: NEW_AND_OLD_IMAGES}
      TimeToLiveSpecification: {AttributeName: expires_at_epoch_s, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  WorkDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600}
  WorkQueue:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 5400
      RedrivePolicy: {deadLetterTargetArn: !GetAtt WorkDlq.Arn, maxReceiveCount: 5}
  AwaitCompletionDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600}
  AwaitCompletionQueue:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 720
      RedrivePolicy: {deadLetterTargetArn: !GetAtt AwaitCompletionDlq.Arn, maxReceiveCount: 5}
  DurableDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600}
  StreamFailureDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600}

  DueWorkDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600}
  DueWorkQueue:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 720
      MessageRetentionPeriod: 86400
      RedrivePolicy: {deadLetterTargetArn: !GetAtt DueWorkDlq.Arn, maxReceiveCount: 5}

  RepairFailureDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600}
  DriverRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: driver
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:log-stream:*'
              - Effect: Allow
                Action: [lambda:CheckpointDurableExecution, lambda:GetDurableExecutionState]
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-durable:*'
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-action:*'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-durable:*'
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DurableDlq.Arn
  CoordinationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]}
      Policies:
        - PolicyName: coordination
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:log-stream:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ResumeTokenSecretArn
              - !If
                - HasWorkerTargets
                - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref WorkerSigningSecretArns}
                - !Ref 'AWS::NoValue'
              - !If
                - RefreshableTargets
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${WorkerSigningSecretNamePrefix}*'
                - !Ref 'AWS::NoValue'
              - !If
                - RefreshableTargets
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${ReleaseArtifactBucket}/${WorkerTargetKey}'
                - !Ref 'AWS::NoValue'
              - !If
                - RefreshableTargets
                - Effect: Allow
                  Action: [lambda:GetAlias, lambda:GetFunctionUrlConfig]
                  Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${WorkerFunctionNamePrefix}*:release'
                - !Ref 'AWS::NoValue'
              - !If
                - RefreshableTargets
                - Effect: Allow
                  Action: lambda:GetFunctionConfiguration
                  Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${WorkerFunctionNamePrefix}*:*'
                - !Ref 'AWS::NoValue'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem, dynamodb:Query, dynamodb:Scan, dynamodb:BatchGetItem, dynamodb:BatchWriteItem]
                Resource: !Ref SemanticDynamoResourceArns
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:ConditionCheckItem, dynamodb:Query]
                Resource: [!GetAtt CallbackBindingTable.Arn, !Sub '${CallbackBindingTable.Arn}/index/*']
              - Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator, dynamodb:ListStreams]
                Resource: [!Ref AwaitInteractionStreamArn, !Ref ExecutionStateStreamArn, !GetAtt CallbackBindingTable.StreamArn]
              - !If
                - HasWorkerTargets
                - Effect: Allow
                  Action: s3:GetObjectVersion
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${ReleaseArtifactBucket}/${WorkerTargetKey}'
                  Condition:
                    StringEquals: {s3:VersionId: !Ref WorkerTargetVersion}
                - !Ref 'AWS::NoValue'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ReleaseArtifactBucket}/tpf/releases/*'
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: [!GetAtt WorkQueue.Arn, !GetAtt AwaitCompletionQueue.Arn, !GetAtt DueWorkQueue.Arn]
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: [!GetAtt WorkQueue.Arn, !GetAtt WorkDlq.Arn, !GetAtt StreamFailureDlq.Arn, !GetAtt RepairFailureDlq.Arn]
              - Effect: Allow
                Action: [lambda:GetDurableExecution, lambda:GetDurableExecutionHistory, lambda:SendDurableExecutionCallbackSuccess, lambda:SendDurableExecutionCallbackFailure, lambda:InvokeFunction]
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-durable:*'
              - !If
                - HasWorkerTargets
                - Effect: Allow
                  Action: [lambda:GetAlias, lambda:GetFunctionUrlConfig]
                  Resource: !Ref WorkerAliasArns
                - !Ref 'AWS::NoValue'
              - !If
                - HasWorkerTargets
                - Effect: Allow
                  Action: lambda:GetFunctionConfiguration
                  Resource: !Ref WorkerVersionArns
                - !Ref 'AWS::NoValue'
              - !If
                - HasWorkerTargets
                - Effect: Allow
                  Action: lambda:InvokeFunctionUrl
                  Resource: !Ref WorkerAliasArns
                  Condition:
                    StringEquals: {lambda:FunctionUrlAuthType: AWS_IAM}
                - !Ref 'AWS::NoValue'
              - !If
                - HasWorkerTargets
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !Ref WorkerAliasArns
                  Condition:
                    Bool: {lambda:InvokedViaFunctionUrl: 'true'}
                - !Ref 'AWS::NoValue'
  DurableFunction:
    Type: AWS::Lambda::Function
    # After stack deletion, redeploying the same stack name conflicts with this retained,
    # fixed-name function. Once its executions and recovery windows have expired,
    # manually delete the retained function before deploying that stack name again.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cfn-lint: {config: {ignore_checks: [E3002]}}
    Properties:
      FunctionName: !Sub '${AWS::StackName}-durable'
      LoggingConfig: {LogGroup: !Ref DurableFunctionLogs}
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref DriverCodeKey, S3ObjectVersion: !Ref DriverCodeObjectVersion}
      Handler: org.pipelineframework.aws.durable.AwsDurableCoordinatorHandler::handleRequest
      Runtime: java21
      Architectures: [arm64]
      Role: !GetAtt DriverRole.Arn
      MemorySize: 1024
      Timeout: 900
      DeadLetterConfig: {TargetArn: !GetAtt DurableDlq.Arn}
      DurableConfig:
        ExecutionTimeout: !Ref DurableExecutionTimeoutSeconds
        RetentionPeriodInDays: !Ref DurableRetentionDays
      Environment:
        Variables: {TPF_AWS_DURABLE_ACTION_FUNCTION: !Ref ActionVersion, TPF_AWS_DURABLE_PUBLICATION_ID: !Ref PlatformPublication}

  DurableVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RuntimePolicy: {UpdateRuntimeOn: FunctionUpdate}
      FunctionName: !Ref DurableFunction
      CodeSha256: !Ref DriverCodeSha256
      Description: !Sub 'TPF AWS Durable ${PlatformPublication}; action ${ActionVersion.Version}'
  DurableAliasResource:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Alias
    Properties:
      Name: !Ref DurableAlias
      FunctionName: !Ref DurableFunction
      FunctionVersion: !GetAtt DurableVersion.Version

  IngressFunction:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Function
    Properties:
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref DriverCodeKey, S3ObjectVersion: !Ref DriverCodeObjectVersion}
      FunctionName: !Sub '${AWS::StackName}-ingress'
      LoggingConfig: {LogGroup: !Ref IngressFunctionLogs}
      Handler: org.pipelineframework.aws.durable.AwsDurableIngressHandler::handleRequest
      Runtime: java21
      Architectures: [arm64]
      Role: !GetAtt DriverRole.Arn
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          TPF_AWS_DURABLE_PUBLICATION_ID: !Ref PlatformPublication
          TPF_AWS_DURABLE_FUNCTION: !Ref DurableFunction
          TPF_AWS_DURABLE_QUALIFIER: !GetAtt DurableVersion.Version

  IngressVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RuntimePolicy: {UpdateRuntimeOn: FunctionUpdate}
      FunctionName: !Ref IngressFunction
      CodeSha256: !Ref DriverCodeSha256
      Description: !Sub 'TPF ingress ${PlatformPublication}'

  ActionFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub '${AWS::StackName}-action'
      LoggingConfig: {LogGroup: !Ref ActionFunctionLogs}
      Runtime: java21
      Role: !GetAtt CoordinationRole.Arn
      Timeout: 120
      MemorySize: 1536
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref ActionCodeKey, S3ObjectVersion: !Ref ActionCodeObjectVersion}
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      Environment:
        Variables:
          QUARKUS_LAMBDA_HANDLER: aws-durable-action
          TPF_AWS_DURABLE_SHARED_REST_COORDINATION: 'true'
          TPF_AWS_DURABLE_DEPLOYMENT_VALIDATION: validated
          TPF_AWS_DURABLE_REST_SIGNING_REGION: !Ref AWS::Region
          TPF_AWS_DURABLE_REST_TARGET_KEY: !Ref WorkerTargetKey
          TPF_AWS_DURABLE_REST_TARGET_VERSION: !If [RefreshableTargets, !Ref 'AWS::NoValue', !Ref WorkerTargetVersion]
          TPF_AWS_DURABLE_REFRESHABLE_REST_TARGETS: !If [RefreshableTargets, 'true', !Ref 'AWS::NoValue']
          TPF_AWS_DURABLE_REST_WORKER_SECRET_ARN_PREFIX: !If
            - RefreshableTargets
            - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${WorkerSigningSecretNamePrefix}'
            - !Ref 'AWS::NoValue'
          TPF_AWS_DURABLE_RESUME_TOKEN_SECRET_ARN: !Ref ResumeTokenSecretArn
          TPF_AWS_DURABLE_RESUME_TOKEN_SECRET_VERSION: !Ref ResumeTokenSecretVersion
          TPF_AWS_DURABLE_ACTION_TIMEOUT_SECONDS: '30'
          TPF_AWS_DURABLE_CALLBACK_RETENTION_SECONDS: '7776000'
          TPF_AWS_DURABLE_BINDING_TABLE: !Ref CallbackBindingTable
          TPF_AWS_DURABLE_BINDING_STREAM_ARN: !GetAtt CallbackBindingTable.StreamArn
          TPF_AWS_DURABLE_AWAIT_STREAM_ARN: !Ref AwaitInteractionStreamArn
          TPF_AWS_DURABLE_EXECUTION_STREAM_ARN: !Ref ExecutionStateStreamArn
          TPF_AWS_DURABLE_FUNCTION: !Sub '${AWS::StackName}-durable'
          TPF_AWS_DURABLE_QUALIFIER: !Ref DurableAlias
          PIPELINE_AWAIT_ADMISSION_STORE: dynamo
          PIPELINE_ORCHESTRATOR_CONTROL_PLANE_ENABLED: 'true'
          PIPELINE_ORCHESTRATOR_CONTROL_PLANE_REQUIRE_REMOTE_WORKER: 'true'
          PIPELINE_ORCHESTRATOR_CONTROL_PLANE_PAYLOAD_MATERIALIZATION: SERIALIZED
          PIPELINE_ORCHESTRATOR_WORKER_TARGETING_MODE: registered-rest
          PIPELINE_ORCHESTRATOR_WORKER_LIFECYCLE_PROVIDER: dynamo
          TPF_AWS_DURABLE_CONFIGURATION: !Sub >-
            {"mode":"QUEUE_ASYNC","strict-startup":"true","idempotency-policy":"CLIENT_KEY_REQUIRED","state-provider":"dynamo","dispatcher-provider":"sqs","sqs.local-loopback":"false","dlq-provider":"sqs","coordination-host":"AWS_DURABLE","process-loops-disabled":"true","queue-url":"${WorkQueue}","dlq-url":"${WorkDlq}","dynamo.execution-table":"${ExecutionTable}","dynamo.execution-key-table":"${ExecutionKeyTable}","dynamo.execution-payload-table":"${ExecutionPayloadTable}","dynamo.await-interaction-table":"${AwaitInteractionTable}","dynamo.await-interaction-key-table":"${AwaitInteractionKeyTable}","dynamo.await-completion-lifecycle-table":"${AwaitCompletionLifecycleTable}","dynamo.await-unit-table":"${AwaitUnitTable}","dynamo.await-admission-table":"${AwaitAdmissionTable}","dynamo.release-table":"${ReleaseTable}","dynamo.worker-table":"${WorkerTable}","dynamo.region":"${AWS::Region}","releases.registry.provider":"dynamo","releases.storage.provider":"s3","releases.storage.s3.bucket":"${ReleaseArtifactBucket}"}
  ActionVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref ActionFunction
      CodeSha256: !Ref ActionCodeSha256
      Description: !Ref PlatformPublication
  WorkFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub '${AWS::StackName}-work'
      LoggingConfig: {LogGroup: !Ref WorkFunctionLogs}
      Runtime: java21
      Role: !GetAtt CoordinationRole.Arn
      Timeout: 120
      MemorySize: 1536
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref ActionCodeKey, S3ObjectVersion: !Ref ActionCodeObjectVersion}
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      Environment:
        Variables:
          QUARKUS_LAMBDA_HANDLER: aws-durable-work-item
          TPF_AWS_DURABLE_SHARED_REST_COORDINATION: 'true'
          TPF_AWS_DURABLE_DEPLOYMENT_VALIDATION: validated
          TPF_AWS_DURABLE_REST_SIGNING_REGION: !Ref AWS::Region
          TPF_AWS_DURABLE_REST_TARGET_KEY: !Ref WorkerTargetKey
          TPF_AWS_DURABLE_REST_TARGET_VERSION: !If [RefreshableTargets, !Ref 'AWS::NoValue', !Ref WorkerTargetVersion]
          TPF_AWS_DURABLE_REFRESHABLE_REST_TARGETS: !If [RefreshableTargets, 'true', !Ref 'AWS::NoValue']
          TPF_AWS_DURABLE_REST_WORKER_SECRET_ARN_PREFIX: !If
            - RefreshableTargets
            - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${WorkerSigningSecretNamePrefix}'
            - !Ref 'AWS::NoValue'
          TPF_AWS_DURABLE_RESUME_TOKEN_SECRET_ARN: !Ref ResumeTokenSecretArn
          TPF_AWS_DURABLE_RESUME_TOKEN_SECRET_VERSION: !Ref ResumeTokenSecretVersion
          TPF_AWS_DURABLE_ACTION_TIMEOUT_SECONDS: '30'
          TPF_AWS_DURABLE_CALLBACK_RETENTION_SECONDS: '7776000'
          TPF_AWS_DURABLE_BINDING_TABLE: !Ref CallbackBindingTable
          TPF_AWS_DURABLE_BINDING_STREAM_ARN: !GetAtt CallbackBindingTable.StreamArn
          TPF_AWS_DURABLE_AWAIT_STREAM_ARN: !Ref AwaitInteractionStreamArn
          TPF_AWS_DURABLE_EXECUTION_STREAM_ARN: !Ref ExecutionStateStreamArn
          TPF_AWS_DURABLE_FUNCTION: !Sub '${AWS::StackName}-durable'
          TPF_AWS_DURABLE_QUALIFIER: !Ref DurableAlias
          PIPELINE_AWAIT_ADMISSION_STORE: dynamo
          PIPELINE_ORCHESTRATOR_CONTROL_PLANE_ENABLED: 'true'
          PIPELINE_ORCHESTRATOR_CONTROL_PLANE_REQUIRE_REMOTE_WORKER: 'true'
          PIPELINE_ORCHESTRATOR_CONTROL_PLANE_PAYLOAD_MATERIALIZATION: SERIALIZED
          PIPELINE_ORCHESTRATOR_WORKER_TARGETING_MODE: registered-rest
          PIPELINE_ORCHESTRATOR_WORKER_LIFECYCLE_PROVIDER: dynamo
          TPF_AWS_DURABLE_CONFIGURATION: !Sub >-
            {"mode":"QUEUE_ASYNC","strict-startup":"true","idempotency-policy":"CLIENT_KEY_REQUIRED","state-provider":"dynamo","dispatcher-provider":"sqs","sqs.local-loopback":"false","dlq-provider":"sqs","coordination-host":"AWS_DURABLE","process-loops-disabled":"true","queue-url":"${WorkQueue}","dlq-url":"${WorkDlq}","dynamo.execution-table":"${ExecutionTable}","dynamo.execution-key-table":"${ExecutionKeyTable}","dynamo.execution-payload-table":"${ExecutionPayloadTable}","dynamo.await-interaction-table":"${AwaitInteractionTable}","dynamo.await-interaction-key-table":"${AwaitInteractionKeyTable}","dynamo.await-completion-lifecycle-table":"${AwaitCompletionLifecycleTable}","dynamo.await-unit-table":"${AwaitUnitTable}","dynamo.await-admission-table":"${AwaitAdmissionTable}","dynamo.release-table":"${ReleaseTable}","dynamo.worker-table":"${WorkerTable}","dynamo.region":"${AWS::Region}","releases.registry.provider":"dynamo","releases.storage.provider":"s3","releases.storage.s3.bucket":"${ReleaseArtifactBucket}"}
  WorkVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref WorkFunction
      CodeSha256: !Ref ActionCodeSha256
      Description: !Ref PlatformPublication
  AwaitCompletionFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub '${AWS::StackName}-awaitcompletion'
      LoggingConfig: {LogGroup: !Ref AwaitCompletionFunctionLogs}
      Runtime: java21
      Role: !GetAtt CoordinationRole.Arn
      Timeout: 120
      MemorySize: 1536
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref ActionCodeKey, S3ObjectVersion: !Ref ActionCodeObjectVersion}
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      Environment:
        Variables:
          QUARKUS_LAMBDA_HANDLER: aws-durable-await-completion
          TPF_AWS_DURABLE_SHARED_REST_COORDINATION: 'true'
          TPF_AWS_DURABLE_DEPLOYMENT_VALIDATION: validated
