version: 2
appName: "Spring gRPC Smoke"
basePackage: "com.example.grpcsmoke"
transport: "GRPC"
platform: "COMPUTE"
types:
  PaymentRequest:
    fields:
      - [paymentId, string]
      - [cents, int32]
  ValidatedPayment:
    fields:
      - [paymentId, string]
      - [cents, int32]
  PaymentReceipt:
    fields:
      - [paymentId, string]
      - [status, string]
steps:
  - name: "validate"
    cardinality: ONE_TO_ONE
    service: "com.example.grpcsmoke.service.ValidatePaymentService"
    input: PaymentRequest
    inboundMapper: "com.example.grpcsmoke.mapper.PaymentRequestMapper"
    output: ValidatedPayment
  - name: "receipt"
    cardinality: ONE_TO_ONE
    service: "com.example.grpcsmoke.service.ReceiptService"
    input: ValidatedPayment
    output: PaymentReceipt
    outboundMapper: "com.example.grpcsmoke.mapper.PaymentReceiptMapper"
