      OKActions: [!Ref AlarmTopicArn]
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions: [{Name: FunctionName, Value: !Sub '${AWS::StackName}-reconcile'}]
  ReconciliationFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
