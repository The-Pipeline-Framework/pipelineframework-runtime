[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tpf-experimental-python-local"
version = "0.0.0"
description = "Experimental runtime for compiler-generated TPF Python LOCAL applications"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tpf_experimental_python_local = ["py.typed"]
