name: Experimental Node LOCAL

on:
  push:
    branches: [main]
    paths:
      - 'experimental/node-local/**'
      - '.github/workflows/experimental-node-local.yml'
  pull_request:
    paths:
      - 'experimental/node-local/**'
      - '.github/workflows/experimental-node-local.yml'

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pack the exact checked-out package
        run: |
          artifacts="$RUNNER_TEMP/node-local-runtime"
          mkdir "$artifacts"
          npm pack --ignore-scripts --pack-destination "$artifacts" ./experimental/node-local
          cd "$artifacts"
          sha256sum ./*.tgz > SHA256SUMS
      - name: Test the installed package in an isolated Node consumer
        run: |
          consumer="$(mktemp -d)"
          cp experimental/node-local/test/runtime.test.mjs "$consumer/"
          cd "$consumer"
          printf '{"type":"module","private":true}\n' > package.json
          npm install --offline --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/node-local-runtime/*.tgz
          node --test runtime.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-local-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/node-local-runtime/
          if-no-files-found: error
          retention-days: 14
