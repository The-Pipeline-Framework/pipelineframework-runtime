      <<: *ReconciliationFunctionAlarmProperties
      MetricName: Throttles
  DurableDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *QueueAlarmProperties
      Dimensions: [{Name: QueueName, Value: !GetAtt DurableDlq.QueueName}]
  RepairFailureDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *QueueAlarmProperties
      Dimensions: [{Name: QueueName, Value: !GetAtt RepairFailureDlq.QueueName}]
  WorkQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *QueueAlarmProperties
      MetricName: ApproximateAgeOfOldestMessage
      Threshold: 300
      Dimensions: [{Name: QueueName, Value: !GetAtt WorkQueue.QueueName}]
  AwaitCompletionQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *QueueAlarmProperties
      MetricName: ApproximateAgeOfOldestMessage
      Threshold: 300
      Dimensions: [{Name: QueueName, Value: !GetAtt AwaitCompletionQueue.QueueName}]
  TransitionRequestQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *QueueAlarmProperties
      MetricName: ApproximateAgeOfOldestMessage
      Threshold: 300
      Dimensions: [{Name: QueueName, Value: !GetAtt TransitionRequestQueue.QueueName}]
  TransitionResponseQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *QueueAlarmProperties
      MetricName: ApproximateAgeOfOldestMessage
      Threshold: 300
      Dimensions: [{Name: QueueName, Value: !GetAtt TransitionResponseQueue.QueueName}]
  AwaitStreamAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      MetricName: IteratorAge
      Statistic: Maximum
      Threshold: 60000
  AwaitStateDroppedEventAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      MetricName: DroppedEventCount
      Dimensions: [{Name: EventSourceMappingUUID, Value: !Ref AwaitWakeupFunctionAwaitState}]
  CallbackBindingDroppedEventAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      MetricName: DroppedEventCount
      Dimensions: [{Name: EventSourceMappingUUID, Value: !Ref AwaitWakeupFunctionCallbackBinding}]
  StreamDestinationDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *AwaitWakeupFunctionAlarmProperties
      MetricName: DestinationDeliveryFailures
  RepairDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      <<: *ReconciliationFunctionAlarmProperties
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions: [{Name: RuleName, Value: !Ref DurableTerminalRule}]
  IngressAsyncDroppedAlarm:
