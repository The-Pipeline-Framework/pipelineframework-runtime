    Properties: &TransitionWorkerFunctionAlarmProperties
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions: [{Name: FunctionName, Value: !Sub '${AWS::StackName}-transition-worker'}]
  TransitionWorkerFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: FunctionTransitionConsumer
    Properties:
      <<: *TransitionWorkerFunctionAlarmProperties
      MetricName: Throttles
  AwaitWakeupFunctionLogs:
