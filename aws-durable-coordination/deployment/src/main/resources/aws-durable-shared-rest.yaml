      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-work'
      RetentionInDays: 30
  AwaitCompletionFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-awaitcompletion'
      RetentionInDays: 30
  AwaitWakeupFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-awaitwakeup'
      RetentionInDays: 30
  ExecutionWakeupFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-executionwakeup'
      RetentionInDays: 30
  DueWorkFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-duework'
      RetentionInDays: 30
  ReconciliationFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-reconciliation'
      RetentionInDays: 30
  LifecycleFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-lifecycle'
      RetentionInDays: 30
  WorkFunctionWork:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref WorkVersion
      EventSourceArn: !GetAtt WorkQueue.Arn
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]

  AwaitCompletionFunctionAwaitCompletion:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref AwaitCompletionVersion
      EventSourceArn: !GetAtt AwaitCompletionQueue.Arn
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]

  DueWorkFunctionTick:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref DueWorkVersion
      EventSourceArn: !GetAtt DueWorkQueue.Arn
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]

  AwaitWakeupFunctionAwaitState:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref AwaitWakeupVersion
      EventSourceArn: !Ref AwaitInteractionStreamArn
      StartingPosition: TRIM_HORIZON
      BatchSize: 10
      BisectBatchOnFunctionError: true
      MetricsConfig: {Metrics: [EventCount]}
      MaximumRecordAgeInSeconds: 3600
      MaximumRetryAttempts: 5
      FunctionResponseTypes: [ReportBatchItemFailures]
      DestinationConfig: {OnFailure: {Destination: !GetAtt StreamFailureDlq.Arn}}
  AwaitWakeupFunctionCallbackBinding:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref 'AwaitWakeupVersion'
      EventSourceArn: !GetAtt 'CallbackBindingTable.StreamArn'
      StartingPosition: TRIM_HORIZON
      BatchSize: 10
      BisectBatchOnFunctionError: true
      MetricsConfig:
        Metrics:
        - EventCount
      MaximumRecordAgeInSeconds: 3600
      MaximumRetryAttempts: 5
      FunctionResponseTypes:
      - ReportBatchItemFailures
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt 'StreamFailureDlq.Arn'

  ExecutionWakeupFunctionExecutionState:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref 'ExecutionWakeupVersion'
      EventSourceArn: !Ref 'ExecutionStateStreamArn'
      StartingPosition: TRIM_HORIZON
      BatchSize: 10
      BisectBatchOnFunctionError: true
      MetricsConfig:
        Metrics:
        - EventCount
      MaximumRecordAgeInSeconds: 3600
      MaximumRetryAttempts: 5
      FunctionResponseTypes:
      - ReportBatchItemFailures
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt 'StreamFailureDlq.Arn'

  DueWorkRule:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: 'rate(1 minute)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt DueWorkQueue.Arn
          Id: bounded-semantic-due-work
          Input: '{"kind":"tpf-due-work-tick"}'
          RetryPolicy: {MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 10}
          DeadLetterConfig: {Arn: !GetAtt DueWorkDlq.Arn}
  DueWorkQueuePolicy:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref DueWorkQueue, !Ref DueWorkDlq]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource: [!GetAtt DueWorkQueue.Arn, !GetAtt DueWorkDlq.Arn]
            Condition: {ArnEquals: {'aws:SourceArn': !GetAtt DueWorkRule.Arn}}

  ReconciliationInvokeConfig:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ReconciliationFunction
      Qualifier: !GetAtt ReconciliationVersion.Version
      MaximumEventAgeInSeconds: 3600
      MaximumRetryAttempts: 2
      DestinationConfig: {OnFailure: {Destination: !GetAtt RepairFailureDlq.Arn}}
  IngressInvokeConfig:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref IngressFunction
      Qualifier: !GetAtt IngressVersion.Version
      MaximumEventAgeInSeconds: 3600
      MaximumRetryAttempts: 2
      DestinationConfig: {OnFailure: {Destination: !GetAtt DurableDlq.Arn}}
  RepairFailureQueuePolicy:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref RepairFailureDlq]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt RepairFailureDlq.Arn
            Condition:
              ArnEquals: {aws:SourceArn: !GetAtt DurableTerminalRule.Arn}
  DurableTerminalRule:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: [aws.lambda]
        detail-type: ['Durable Execution Status Change']
        detail:
          functionArn:
            - prefix: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-durable:'
      Targets:
        - Arn: !Ref ReconciliationVersion
          Id: targeted-durable-reconciliation
          RetryPolicy: {MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 5}
          DeadLetterConfig: {Arn: !GetAtt RepairFailureDlq.Arn}
  DurableTerminalPermission:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReconciliationVersion
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DurableTerminalRule.Arn

  LifecycleAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref LifecycleFunction
      Name: lifecycle
      FunctionVersion: !GetAtt LifecycleVersion.Version
  LifecycleUrl:
    Type: AWS::Lambda::Url
    DependsOn: LifecycleAlias
    Properties:
      AuthType: AWS_IAM
      TargetFunctionArn: !Ref LifecycleFunction
      Qualifier: lifecycle
Outputs:
  LifecycleAliasArn: {Value: !Ref LifecycleAlias}
  LifecycleOrigin: {Value: !GetAtt LifecycleUrl.FunctionUrl}
  CoordinatorInvokerRoleArn: {Value: !GetAtt CoordinationRole.Arn}
  IngressVersionArn: {Value: !Ref IngressVersion}
  DurableVersionArn: {Value: !Ref DurableVersion}
  ActionVersionArn: {Value: !Ref ActionVersion}
